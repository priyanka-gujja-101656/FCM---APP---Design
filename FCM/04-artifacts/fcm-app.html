    case 'markpaid':{S.paid[arg]=true;const inv=IN(arg);const f=F(inv.fam);
      if(f&&f.balance>0)f.balance=0;
      toast(`Invoice #${arg.replace('inv-','')} marked paid`);render(true);break;}

    case 'review': sheet('review',arg);break;
    case 'dosign':{const a2=ACTIVITIES.find(x=>x.id===arg);if(a2)a2.review=false;
      closeSheet();toast('Incident signed off and sent to the family');render(true);break;}

    case 'fix':{S.resolved[arg]='accept';toast('Claim line adjusted');render(true);break;}
    case 'keep':{S.resolved[arg]='keep';toast('Kept as claimed · flagged for the state');render(true);break;}
    case 'submit': toast('May claim submitted to TN CCAP');break;

    case 'ask':{S.assistant.push({d:'out',t:esc(arg)});
      S.assistant.push({d:'in',t:answerFor(arg)});S.draft='';render();break;}
    case 'asksend':{const v=($('#msg')?.value||'').trim();if(!v)break;
      S.assistant.push({d:'out',t:esc(v)});S.assistant.push({d:'in',t:answerFor(v)});
      S.draft='';render();break;}
    case 'send':{const v=($('#msg')?.value||'').trim();if(!v)break;
      const t=THREADS.find(x=>x.id===S.arg);
      if(t)t.msgs.push({d:'out',t:v,at:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});
      S.draft='';render();break;}

    case 'relocate': S.moveTo=null;sheet('relocate',arg);break;
    case 'moveto': S.moveTo=arg;sheet('relocate',S.relArg);break;
    case 'domove':{const k=K(arg);const to=ROOMS.find(r=>r.id===S.moveTo);
      k.room=S.moveTo;closeSheet();toast(`<b>${k.name}</b> moved to ${to.name}`);
      S.moveTo=null;render(true);break;}
    case 'acctactions': S.finArg=arg;sheet('acctactions',arg);break;
    case 'invactions': S.finArg=arg;sheet('invactions',arg);break;
    case 'creason': fin.reason=arg;sheet($('#sheet').dataset.kind,S.finArg);break;
    case 'charge': fin.reason=CREDIT_REASONS[0];S.finArg=arg;sheet('charge',arg);break;
    case 'docharge':{const f=F(arg);const w=($('#cwhat')?.value||'Charge').trim();
      const a=parseFloat($('#camt')?.value||'0');
      if(!(a>0)){toast('Enter an amount');break;}
      f.balance+=a;FAM_DETAIL[f.id].ledger.unshift({d:dateLabel(new Date()),t:w,type:'charge',a});
      closeSheet();toast(`${m(money(a))} charged to ${f.name}`);render(true);break;}
    case 'credit': fin.reason=CREDIT_REASONS[0];S.finArg=arg;sheet('credit',arg);break;
    case 'docredit':{const f=F(arg);const a=parseFloat($('#camt')?.value||'0');
      if(!(a>0)){toast('Enter an amount');break;}
      f.balance=Math.max(0,f.balance-a);
      FAM_DETAIL[f.id].ledger.unshift({d:dateLabel(new Date()),t:'Credit · '+fin.reason,type:'payment',a});
      closeSheet();toast(`${m(money(a))} credited · ${fin.reason.toLowerCase()}`);render(true);break;}
    case 'statement': S.finArg=arg;sheet('statement',arg);break;
    case 'dostatement':{const f=F(arg);closeSheet();toast(`Statement emailed to ${m(f.contact)}`);break;}
    case 'newinv': fin={amount:'',method:'Card',reason:CREDIT_REASONS[0],lines:[],open:'fam',fam:null};sheet('newinv');break;
    case 'iopen': fin.open=fin.open===arg?null:arg;sheet('newinv');break;
    case 'ifam': fin.fam=arg;fin.open=null;sheet('newinv');break;
    case 'addline':{const d2=($('#lwhat')?.value||'').trim(),a=parseFloat($('#lamt')?.value||'0');
      if(!d2||!(a>0)){toast('Give the line a description and an amount');break;}
      fin.lines.push({d:d2,amt:a});sheet('newinv');break;}
    case 'rmline': fin.lines.splice(Number(arg),1);sheet('newinv');break;
    case 'docreateinv':{const f=F(fin.fam);const id=nextInvId();
      INVOICES.unshift({id,fam:f.id,family:f.name,period:'June 2026',issued:dateLabel(new Date()),
        due:'Jun 15, 2026',status:'open',
        lines:fin.lines.map(l=>({d:l.d,q:1,r:l.amt}))});
      f.balance+=fin.lines.reduce((a,l)=>a+l.amt,0);
      closeSheet();toast(`Invoice #${id.replace('inv-','')} created and sent`);
      fin.lines=[];render(true);break;}
    case 'void': fin.reason=VOID_REASONS[0];S.finArg=arg;sheet('void',arg);break;
    case 'dovoid':{const i2=IN(arg);S.voided[arg]=fin.reason;
      const f=F(i2.fam); f.balance=Math.max(0,f.balance-invTotal(i2));
      closeSheet();toast(`Invoice #${arg.replace('inv-','')} voided · ${fin.reason.toLowerCase()}`);
      render(true);break;}
    case 'sendinv': S.finArg=arg;sheet('sendinv',arg);break;
    case 'dosendinv': closeSheet();
      toast(arg==='email'?'Invoice emailed':arg==='app'?'Invoice sent in the app':'Invoice emailed and sent in the app');break;
    case 'newmsg': compose={to:new Set(),subject:'',body:'',att:false,open:'to',room:null};sheet('compose');break;
    case 'copen': stashCompose();compose.open=compose.open===arg?null:arg;sheet('compose');break;
    case 'cto': stashCompose();compose.to.has(arg)?compose.to.delete(arg):compose.to.add(arg);sheet('compose');break;
    case 'usetpl':{stashCompose();const t=TEMPLATES.find(x=>x.id===arg);
      compose.subject=t.name;compose.body=t.body;compose.open=null;sheet('compose');break;}
    case 'cattach': stashCompose();compose.att=true;compose.open=null;sheet('compose');break;
    case 'cdetach': stashCompose();compose.att=false;sheet('compose');break;
    case 'savedraft': stashCompose();closeSheet();toast('Saved as a draft');break;
    case 'sendmsg':{stashCompose();
      if(!compose.to.size){toast('Choose who this is for');break;}
      if(!compose.body.trim()){toast('Write a message first');break;}
      const n2=compose.to.size;
      const first=[...compose.to][0];
      const who=(K(first)&&F(K(first).fam).contact)||(ST(first)&&ST(first).name)||roomName(first);
      THREADS.unshift({id:'t'+Date.now(),who:m(who),ini:(who||'?').slice(0,2).toUpperCase(),
        scope:ST(first)?'staff':'family',sub:compose.subject||'From Rebecca',
        rid:K(first)?K(first).room:(ROOMS.find(r=>r.id===first)?first:'r-prek4'),
        unread:false,at:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),
        msgs:[{d:'out',t:compose.body.trim(),at:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}]});
      closeSheet();toast(`Sent to ${n2} ${n2===1?'recipient':'recipients'}`);
      compose={to:new Set(),subject:'',body:'',att:false,open:null,room:null};
      render(true);break;}
    case 'clearsig':{const c=$('#pad'); if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);
      draft.sig=false;S.inSig=false;$('.sigh3')?.classList.remove('gone');
      const kd=$('#sheet').dataset.kind, b=$('#sheet .shfoot2 .primary, #sheet .shfoot2 .second');
      if(b&&(kd==='signin'||kd==='signout'))b.dataset.act='nosig';
      break;}
    case 'ptype':{const keep=draft.type; draft=freshDraft(); draft.t=nowT();
      draft.type=arg; sheet('log'); break;}
    case 'dopen':{const d=$('#det'); if(d)draft.det=d.value;
      draft.open=draft.open===arg?null:arg;S.ffq='';
      if(draft.open==='time'){CLK='draft';draft.cmode='h';}
      if(draft.open==='date')draft.mOff=0;
      sheet('log');break;}
    case 'setdate': draft.off=+arg;draft.open=null;sheet('log');break;
    case 'cmon': draft.mOff=(draft.mOff||0)+(+arg);repaintCal();break;
    case 'dmeal': draft.meal=arg;draft.qty='';draft.open='qty';sheet('log');break;
    case 'dqty': draft.qty=arg;draft.open=null;sheet('log');break;
    /* adding a room brings its children with it, which is what "post to the room"
       meant before, and removing one takes them away again */
    case 'droomm':{
      if(draft.rooms.has(arg)){draft.rooms.delete(arg);
        kidsIn(arg).forEach(k=>draft.picked.delete(k.id));}
      else {draft.rooms.add(arg); kidsIn(arg).forEach(k=>draft.picked.add(k.id));}
      sheet('log');break;}
    case 'droomall':
      draft.rooms.clear();draft.picked.clear();
      if(arg==='all')ROOMS.filter(r=>inRoom(r.id)).forEach(r=>{
        draft.rooms.add(r.id);kidsIn(r.id).forEach(k=>draft.picked.add(k.id));});
      sheet('log');break;
    case 'dkidm': draft.picked.has(arg)?draft.picked.delete(arg):draft.picked.add(arg);
      sheet('log');break;
    case 'dkidall': draft.picked.clear();
      if(arg==='all')draftKids().forEach(k=>draft.picked.add(k.id));
      sheet('log');break;
    case 'dvis':{const d=$('#det'); if(d)draft.det=d.value; draft.vis=arg;sheet('log');break;}
    case 'dopost':{const d=$('#det'); if(d)draft.det=d.value;
      const ty=POST_TYPES.find(x=>x[0]===draft.type);
      const n2=draftCount();
      if(!draft.rooms.size||!n2){toast('Pick a classroom and who it is for');break;}
      /* one entry per classroom, so each room's feed reads as its own day */
      const picked=[...draft.picked].map(id=>K(id)).filter(Boolean);
      [...draft.rooms].forEach(rid=>{
        const inRm=picked.filter(k=>k.room===rid);
        if(!inRm.length) return;
        const whole=inRm.length===kidsIn(rid).length;
        ACTIVITIES.unshift({id:'a'+Date.now()+rid,kid:whole?'Room':inRm[0].name,
        ini:ROLE.ini,type:draft.type,icon:ty[2],title:ty[1],by:ROLE.who,
        room:roomName(rid),rid:rid,
        at:timeStr(),on:dateStr(),
        review:false,body:draft.det||`${ty[1]} logged for ${whoLabel().toLowerCase()}.`});
      });
      closeSheet();
      toast(`Posted to ${n2} ${n2===1?'family':'families'}`);
      draft=freshDraft(); draft.t=nowT();
      render(true);break;}
    /* A confirm's act is either a function to run or an action string to
       dispatch. It only ran functions, so Log out, Switch role, Move centre
       and Notify the director all threw and did nothing. */
    case 'cfyes':{const f=pending;confirmClose();
      if(typeof f==='function')f(); else if(typeof f==='string'&&f)doAct(f);
      break;}
    case 'cfno': confirmClose();break;
    case 'ciotab': S.cioTab=arg;render();break;
    case 'ciotog':{CIO[arg]=!CIO[arg];
      toast(`${CIO[arg]?'On':'Off'} \u00b7 saved`);render(true);break;}
    case 'ciohq':{CIO.hq[+arg]=!CIO.hq[+arg];toast('Saved');render(true);break;}
    case 'cionot':{const [rule,who]=arg.split(':');
      CIO.not[rule][who]=!CIO.not[rule][who];toast('Saved');render(true);break;}
    case 'ciorad':{const [k,v]=arg.split(':');
      CIO[k]=/^\d+$/.test(v)?+v:v;
      /* picking how the code rotates means the code is required, and picking
         when a signature is taken means one is taken */
      if(k==='rot')CIO.qr=true;
      toast('Saved');render(true);break;}
    case 'logout': doLogout();break;
    case 'soon': toast(esc(arg));break;
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  /* a menu closes on any tap that is not inside it or on its own control */
  if(S.hmenu&&!e.target.closest('#hmenu')&&!(el&&/^hmenu:/.test(el.dataset.act))){
    S.hmenu=null;render(true);}
  if(el){e.preventDefault();doAct(el.dataset.act);return;}
  if(e.target.id==='scrim') closeSheet();
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('#confirmwrap')){confirmClose();return;} closeSheet();});

/* clock */
(function clock(){
  const t=$('#clock');
  if(t) t.textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s?(AM|PM)/,'');
  setTimeout(clock,30000);
})();

/* the role is the URL's to set, so there is nothing to mark */
document.title=`FCM ${ROLE.label}, ${CENTER.name}`;

/* the layout is a different shape either side of 1100, so redraw when it crosses */
(function(){let wide=isWide(), rail=isRail();
  window.addEventListener('resize',()=>{const w=isWide(), r=isRail();
    if(w!==wide||r!==rail){wide=w;rail=r;render();}});
})();

/* ============================================================
   FUS-19. The log-in gate. One page, and nothing else asked.
   The button is always live: a tap with an empty field returns a validation
   error rather than sitting there dimmed, because a control you cannot use
   tells you nothing about why.
   The error names NEITHER field. Saying which half was wrong tells an attacker
   that the other half was right, so the message sits above both and both
   borders go red, the way FUS-20 draws it.
   ============================================================ */
const GATE_EL=$('#gate');
let gateStay=true;

const TICK=ic('check','','#fff','3.2');
function gateError(msg,only){
  $('#gbanner').innerHTML=msg?`<div class="fcm-banner" role="alert">
    <span class="bn-i">${ic('alert','ic sm','currentColor','1.8')}</span>
    <p class="bn-t">${esc(msg)}</p></div>`:'';
  /* FUS-20 marks both fields, because saying which half was wrong tells you the
     other half was right. FUS-25 marks the username alone, because the account
     is the thing that does not exist. */
  $('#guserbox').classList.toggle('is-error',!!msg);
  $('#gpwbox').classList.toggle('is-error',!!msg&&only!=='user');
  if($('.recover'))$('.recover').hidden=only==='user';
  ['#guser','#gpw'].forEach(sel=>{
    const el=$(sel);
    if(msg){el.setAttribute('aria-invalid','true');}else{el.removeAttribute('aria-invalid');}
  });
}
function setStay(on){
  gateStay=on;
  $('#gstay').setAttribute('aria-checked',String(on));
  const cb=$('#gstaycb');
  cb.classList.toggle('on',on);
  cb.innerHTML=on?TICK:'';
}
function setEye(shown){
  const eye=$('#geye');
  $('#gpw').type=shown?'text':'password';
  eye.setAttribute('aria-pressed',String(shown));
  eye.setAttribute('aria-label',shown?'Hide password':'Show password');
  eye.innerHTML=ic(shown?'eyeoff':'eye','ic sm','currentColor','1.8');
}
function showGate(){
  if(!GATE_EL) return;
  closeSheet();
  const busy=$('#gbusy'); if(busy)busy.remove();
  $('#gateform').hidden=false;
  $('.authfoot').hidden=false;
  const pc=$('.previewcred'); if(pc)pc.hidden=false;
  $('#app').classList.add('behind-gate'); $('#tabs').classList.add('behind-gate');
  $('#guser').value=''; $('#gpw').value='';
  setEye(false); setStay(true); gateError('');
  GATE_EL.hidden=false;
}
function doLogout(){ clearSession(); showGate(); }

/* The username decides which login scenario you are in, so one prototype
   carries them all. Anything not listed here is the ordinary path, FUS-19. */
const ACCOUNTS=[
  {match:/^(new|nobody|noone|unknown)/i, kind:'noaccount'},
  {match:/^tara/i,  kind:'mfa',     to:'teacher'},
  {match:/^maria/i, kind:'tworoles',to:'teacher'},
  {match:/^james/i, kind:'twocentres',to:'teacher'},
  /* One child, so the card has nothing to select between and check-in is a
     single button. The Johnsons are the two child family. */
  {match:/^test0?2$/i, kind:'onechild', fam:'f-thompson'}];
/* Test / Test is the preview happy path for both staff roles, so it is
   matched before anything else and always takes FUS-19. */
const accountFor=u=>/^test$/i.test(u.trim())?{kind:'plain'}
  :(ACCOUNTS.find(a=>a.match.test(u))||{kind:'plain'});
function doLogin(){
  const u=($('#guser').value||'').trim(), pw=$('#gpw').value||'';
  if(!u||!pw){
    gateError('Enter your username or email and your password.');
    (!u?$('#guser'):$('#gpw')).focus();
    return;
  }
  /* FUS-25. Someone was told they have access and they do not. Saying
     "incorrect password" would send them round password recovery forever. */
  if(accountFor(u).kind==='noaccount'){
    gateError('We cannot find an account for that username. Ask your centre to set one up.','user');
    $('#guser').focus(); return;
  }
  gateError('');
  $('#gateform').hidden=true;
  $('.authfoot').hidden=true;
  const pc=$('.previewcred'); if(pc)pc.hidden=true;
  /* the one moment the tenant is being resolved, and nothing is asked for it */
  GATE_EL.insertAdjacentHTML('beforeend',
    `<div class="gbusy" id="gbusy"><div class="gspin" aria-hidden="true"></div>
      <h1 class="auth-h" role="status" style="margin:0">Logging you in</h1></div>`);
  const acc=accountFor(u);
  /* a login that belongs to a different family re-points the parent role
     before the app draws, so the first paint is already theirs */
  if(acc.kind==='onechild'&&acc.fam){const f=FAMILIES.find(x=>x.id===acc.fam);
    ROLES.parent.fam=acc.fam;
    if(f){ROLES.parent.who=f.contact;
      ROLES.parent.ini=f.contact.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}}
  setTimeout(()=>{
    const b=$('#gbusy'); if(b)b.remove();
    if(acc.kind==='mfa'){showMfa(u);return;}
    /* FUS-31. Valid for two centres, and the app cannot guess, so the choice
       comes after the password rather than before it. Nobody types a code. */
    if(acc.kind==='twocentres'){showCentrePick(acc);return;}
    landIn(acc);
  },900);
}

/* The end of every login path: the gate goes, the app draws, and the person is
   told which role they landed in, because two homes can look alike. */
function landIn(acc){
  /* "Keep me logged in on this device" now means it */
  if(gateStay) saveSession(ROLE.id); else clearSession();
  GATE_EL.hidden=true;
  $('#app').classList.remove('behind-gate'); $('#tabs').classList.remove('behind-gate');
  render();
  toast(acc&&acc.kind==='tworoles'
    ? `Logged in as ${ROLE.label}. Your family role is behind the avatar.`
    : `Logged in as ${ROLE.label}`);
}
/* FUS-31. The one case that cannot honour "never pick a school at login": it
   is asked after authenticating, and the last one is offered first next time. */
function showCentrePick(acc){
  let pick='cedar', all=false;
  const row=([g,id,name,sub])=>`<div class="grow"><button class="gr pickrow${pick===id?' on':''}"
     role="radio" aria-checked="${pick===id}" data-ctr="${id}">
     <span class="rad${pick===id?' on':''}"></span>
     <span class="pk-g">${g}</span>
     <span class="pk-t"><b>${name}</b><small>${sub}</small></span>
    </button></div>`;
  const draw=()=>{const list=all?ALLCENTRES:ALLCENTRES.slice(0,2);
    $('#gctr').innerHTML=`<div class="brand"><span class="glyph">F</span><b>FACTS Childcare</b></div>
    <div class="card loginc" style="width:100%">
     <h1 class="auth-h left" style="margin:0 0 8px">Which centre today?</h1>
     <p class="gsub" style="margin:0 0 18px">Your login works at all of them. Pick one to start;
      you can switch later without logging out.</p>
     <span class="pick-l">Centre</span>
     <div class="grp2${all?' scrolls':''}" role="radiogroup" aria-label="Centre">${list.map(row).join('')}</div>
     ${all?'':`<button class="showall" data-all="1">Show all ${ALLCENTRES.length} centres</button>`}
     <button class="primary" data-go="1" style="width:100%;margin-top:14px">Continue</button>
    </div>`;};
  GATE_EL.insertAdjacentHTML('beforeend',
    `<div class="gbusy" id="gctr" style="justify-content:flex-start">
      <div class="brand"><span class="glyph">F</span><b>FACTS Childcare</b></div></div>`);
  draw();
  $('#gctr').addEventListener('click',e=>{
    const r=e.target.closest('[data-ctr]');
    if(r){pick=r.dataset.ctr;draw();return;}
    if(e.target.closest('[data-all]')){all=true;draw();return;}
    if(e.target.closest('[data-go]')){
      const c=ALLCENTRES.find(x=>x[1]===pick);
      CENTER.name=c[2]; $('#gctr').remove(); landIn(acc);
      toast(`Logged in at <b>${c[2]}</b>`);
    }
  });
}
/* FUS-23. Six boxes, because a code is six characters and reads as six. */
let mfaCode='';
function showMfa(user){
  mfaCode='';
  GATE_EL.insertAdjacentHTML('beforeend',`<div class="gbusy" id="gmfa" style="justify-content:flex-start">
    <div class="card loginc" style="width:100%">
     <h1 class="auth-h left" style="margin:0 0 8px">Check your phone</h1>
     <p class="gsub" style="margin:0 0 20px">We sent a six digit code to the number ending 4182.</p>
     <div class="mfarow" id="mfarow">${[0,1,2,3,4,5].map(i=>
       `<span class="mfab" data-i="${i}"></span>`).join('')}</div>
     <button class="primary" id="mfago" style="width:100%;margin-top:22px">Verify</button>
     <p class="gsub" id="mfanote" style="margin:14px 0 0">Resend the code in 30 seconds.</p>
    </div></div>`);
  const paint=()=>{[...document.querySelectorAll('.mfab')].forEach((b,i)=>{
    b.textContent=mfaCode[i]||''; b.classList.toggle('on',i<mfaCode.length);});};
  document.addEventListener('keydown',function onKey(e){
    if(!$('#gmfa')){document.removeEventListener('keydown',onKey);return;}
    if(/^[0-9]$/.test(e.key)&&mfaCode.length<6){mfaCode+=e.key;paint();}
    if(e.key==='Backspace'){mfaCode=mfaCode.slice(0,-1);paint();}
  });
  $('#mfago').addEventListener('click',()=>{
    if(mfaCode.length<6){
      /* a wrong or short code says so without clearing what was typed */
      $('#mfanote').textContent='That code is not right. Check the six digits and try again.';
      return;}
    $('#gmfa').remove(); landIn({kind:'mfa'});
  });
}

if(GATE_EL){
  setEye(false); setStay(true);
  $('#gbtn').addEventListener('click',doLogin);
  $('#geye').addEventListener('click',()=>{setEye($('#gpw').type==='password');$('#gpw').focus();});
  $('#gstay').addEventListener('click',()=>setStay(!gateStay));
  ['guser','gpw'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    if(id==='guser'){$('#gpw').focus();}else{doLogin();}
  }));
  /* ?loggedin=1 skips the gate, so a deep link into a screen still lands there.
     A kiosk never sees it: the PIN is its whole identity. */
  /* a kiosk is never logged in, ?loggedin=1 still skips the gate for a deep
     link, and otherwise the gate shows only when there is no session */
  if(!KIOSK&&new URLSearchParams(location.search).get('loggedin')!=='1'&&!readSession()) showGate();
}

render();
</script>
