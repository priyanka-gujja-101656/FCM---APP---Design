       a.kid!=='Room'&&myKids().length>1?m(a.kid.split(' ')[0])+' · ':''}${m(a.room)} · ${m(a.by)}</small></span>
     <span class="pc-w">${a.at}</span></div>
    ${a.photos?`<div class="phrow">${thumb.repeat(3)}<span class="phb more">+5</span></div>`:''}
    <p class="pc-b">${a.body}</p>
    <div class="pc-f">
     <span class="pc-tags">${ack?(done
       ? `<span class="ptag" style="background:rgba(78,114,99,.16);color:var(--present)">${ic('check','ic sm','var(--present)','2.4')}Acknowledged</span>`
       : `<button class="mini lbl pri" data-act="ack:${a.id}">Acknowledge</button>`):''}</span>
     <span class="ptag" style="background:${f};color:${i}">${cat}</span>
    </div>
   </div>`;
}

function vThread(){
  if(isRail()&&ROLE.scope!=='family') return vMessagesWide();
  const t=THREADS.find(x=>x.id===S.arg);
  if(!t) return vMessages();
  /* a thread that is not yours does not open */
  if(!visibleThreads().some(x=>x.id===t.id)) return denied('That conversation');
  /* the messages are stored from the centre's side, so a parent reading the
     same thread sees their own words on the right, not the left */
  const par=ROLE.scope==='family';
  const w=par&&t.with?t.with:null;
  const side=d=>par?(d==='in'?'out':'in'):d;
  return `${topbar(m(w?w.name:t.who),m(w?w.role:t.sub))}
  <div class="body thread">
   <div class="daymark">Today</div>
   ${t.msgs.map(msg=>`<div class="bub ${side(msg.d)}"><p>${esc(msg.t)}</p><span class="bt">${msg.at}</span></div>`).join('')}
  </div>

   <input class="cinput" id="msg" placeholder="Message ${t.who.split(' ')[0]}" value="${esc(S.draft)}">
   <button class="csend" data-act="send" aria-label="Send">${ic('send','ic sm','var(--npds-blue-700)','1.8')}</button>
  </div>`;
}

function answerFor(q){
  const s=q.toLowerCase();
  /* the assistant answers within the role's scope, and says so rather than
     refusing blankly when a question falls outside it */
  if(!CAN.money && /outstanding|owe|collect|invoice|revenue|subsidy|claim|payroll|billing/.test(s))
    return "Billing sits with the centre director — I can't see it from here. Ask me about your room's register, allergies or activities.";
  if(!CAN.staff && /staff|cert|credential|roster|payroll/.test(s))
    return "Staffing sits with the centre director. I can tell you about the children in "+roomName(ROLE.room)+" though.";
  if(CAN.rooms==='one'){
    const mine=KIDS.filter(k=>inRoom(k.room));
    if(/not checked in|who is missing|not in/.test(s)){
      const n=mine.filter(k=>k.status!=='here'&&k.status!=='absent');
      return n.length?`${n.length} not in yet: ${n.map(k=>k.name).join(', ')}.`:'Everyone in your room is checked in.';
    }
    if(/allerg/.test(s)){
      const a=mine.filter(k=>k.allergy);
      return a.length?a.map(k=>`${k.name} · ${k.allergy}`).join('. ')+'.':'No allergies recorded in your room.';
    }
    if(/posted|activit|today/.test(s)){
      const n=visibleActivities().length;
      return `${n} ${n===1?'activity has':'activities have'} been posted for ${roomName(ROLE.room)} today.`;
    }
  }
  if(s.includes('outstanding')||s.includes('owe')||s.includes('collect'))
    return `${money(outstanding())} is outstanding across ${FAMILIES.filter(f=>f.balance>0).length} families. The Garcia invoice is the only overdue one — 7 days, card declined.`;
  if(s.includes('capacity')||s.includes('room')||s.includes('full')){
    const tight=ROOMS.filter(r=>here(kidsIn(r.id))/r.cap>=.5).map(r=>r.name);
    return `No room is over ratio today. ${tight.length?tight.join(' and ')+' are the fullest.':'All rooms have open seats.'} Pre-K 4 has 3 in with 1 teacher, within limit.`;
  }
  if(s.includes('subsidy')||s.includes('ccap')||s.includes('claim')){
    const left=CLAIMS[0].mismatches.filter(x=>!S.resolved[x.id]).length;
    return left?`The May claim has ${left} unresolved ${left===1?'mismatch':'mismatches'} worth $384. Clearing them releases the claim before the Jun 15 deadline.`
      :'The May claim is clear and ready to submit to TN CCAP.';
  }
  if(s.includes('staff')||s.includes('cert')||s.includes('credential'))
    return `${alertTotal()} credential alerts. Maria Lopez's state cert and first aid both expired Jul 2025 — she is the one to handle first.`;
  if(s.includes('attendance')||s.includes('here')||s.includes('present'))
    return `${here(KIDS)} of ${KIDS.length} children are in. Jaylen Thompson is out — his mother messaged about a low fever.`;
  return `I can answer on attendance, billing, subsidy claims, staffing and compliance for ${CENTER.name}. Ask about any of those.`;
}

/* ============================================================
   PA-2. Check-in and check-out: four settings, nine controls. They cannot all
   sit on one screen, so each one is a tab and the page shows the setting you
   are on. It is the page People and Finance already use, so there is nothing
   new to learn. It lands on QR code.

   NOTHING SAVES. A switch takes effect the instant it is pressed, and these
   panels are nothing but switches and radios, so there is no Done button
   anywhere in this feature.

   The controls are named apart from the page that holds them: a tab panel is a
   container, not a component, and the thing being designed is what is inside it.
   ============================================================ */
const sw=on=>`<span class="fcm-switch" role="switch" aria-checked="${!!on}"></span>`;
/* two lines and a switch */
const srow2=o=>`<button class="srow two" data-act="${o.act}">
  <span class="st"><b>${o.n}</b><small>${o.s}</small></span>${sw(o.on)}</button>`;
/* No dimmed state. Nothing in this product is drawn disabled: a control a
   director cannot use is a note, not a control, so it does not appear. */
const prow=o=>`<button class="prow" role="radio" aria-checked="${!!o.on}" data-act="${o.act}">
  <span class="rad${o.on?' on':''}"></span>
  <span class="pt"><b>${o.n}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`;
/* a card of rows. Pass a label and the card becomes the radiogroup its prows
   need: a role="radio" with no group around it names nothing. */
const scard=(r,grp)=>`<div class="card scard"${grp?` role="radiogroup" aria-label="${grp}"`:''}>${r.join('')}</div>`;
const warnbox=t=>`<div class="warnbox"><span class="wb-i">${ic('alert','ic','currentColor','1.9')}</span><p>${t}</p></div>`;

/* ONE card: the switch and the three rotation choices are one setting, so they
   are one card of rows with hairlines between them, the way every field card in
   the app reads. The rotation keeps a quiet header row, because three bare
   radios sitting under a switch do not say what they are choosing between. */
const qrBody=()=>
  scard([srow2({n:'Require a QR code',s:'Parents scan the room code.',on:CIO.qr,act:'ciotog:qr'}),
         `<span class="lhead">How the code rotates</span>`,
         `<div role="radiogroup" aria-label="How the code rotates">
           ${prow({n:'Every scan',on:CIO.rot===0,act:'ciorad:rot:0'})}
           ${prow({n:'Every day',s:'Yesterday\u2019s stops overnight.',on:CIO.rot===1,act:'ciorad:rot:1'})}
           ${prow({n:'Never',s:'One fixed code, printed once.',on:CIO.rot===2,act:'ciorad:rot:2'})}
          </div>`])
 +(CIO.rot===2?warnbox('<b>A static code can be photographed.</b> A picture of it checks a child in from anywhere.'):'');

const sigBody=()=>
  scard([srow2({n:'Require a signature',s:'Whoever drops off or collects signs on the device.',on:CIO.sig,act:'ciotog:sig'}),
         `<span class="lhead">When it is taken</span>`,
         `<div role="radiogroup" aria-label="When it is taken">
           ${prow({n:'Check-in and check-out',s:'Both ends of the day.',on:CIO.when==='both',act:'ciorad:when:both'})}
           ${prow({n:'Check-out only',s:'Collection is the one that has to be proved.',on:CIO.when==='out',act:'ciorad:when:out'})}
          </div>`]);

const ratioBody=()=>
  scard([prow({n:'Block it',s:'Nobody gets in who would put the room out of ratio.',on:CIO.ratio===0,act:'ciorad:ratio:0'}),
         prow({n:'Allow all scheduled',s:'Anyone booked for today gets in. You are told after.',on:CIO.ratio===1,act:'ciorad:ratio:1'})],
        'Ratio at check-in');

const arrBody=()=>
  scard([srow2({n:'Allow late arrivals',s:'Off, a parent cannot finish check-in after 9:00 AM.',on:CIO.late,act:'ciotog:late'}),
         srow2({n:'Allow unscheduled arrivals',s:'A child not booked for today can still be checked in.',on:CIO.unsched,act:'ciotog:unsched'})])
 +(CIO.late?'':warnbox('A late parent will see <b>\u201cCheck-in is closed. We have notified the staff, please wait.\u201d</b> and staff finish it.'));

/* The tab carries the SHORT label, the way the feature set writes it: QR, not
   QR code, and Ratio, not Ratio at check-in. The long name is the setting's
   name, and the topbar is already saying where you are, so spelling it out
   again in the tab only pushes the pill wider than the card under it. */

const CIOBODY={qr:qrBody,sig:sigBody,ratio:ratioBody,arr:arrBody};

/* a signature is drawn, so it needs the canvas wired every time the sheet redraws */
function wirePad(){
  const c=$('#pad'); if(!c||c.dataset.on)return; c.dataset.on='1';
  const x=c.getContext('2d'); x.lineWidth=3; x.lineCap='round'; x.strokeStyle='#2C312B';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)*(c.width/r.width),(t.clientY-r.top)*(c.height/r.height)];};
  const start=e=>{drawing=true;x.beginPath();x.moveTo(...pos(e));
    draft.sig=true;S.inSig=true;$('.sigh3')?.classList.add('gone');
    /* the check-in button is enabled in place: re-rendering the sheet here
       would clear the canvas the parent is still drawing on */
    const b=$('#sheet .shfoot2 .off');
    if(b&&S.pickArg){b.classList.remove('off');
      const out=$('#sheet').dataset.kind==='signout';
      b.dataset.act=S.multi.length>1 ? `domulti:${out?'out':'in'}`
        : (out?'docheckout:':'docheckin:')+S.pickArg;}
    e.preventDefault();};
  const move=e=>{if(!drawing)return;x.lineTo(...pos(e));x.stroke();e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
}

const TABS=ROLE.tabs;

const V={home:vHome,rooms:vRooms,people:vPeople,finance:vFinance,more:vMore,
  room:vRoom,attendance:vAttendance,activities:vActivities,messages:vMessages,thread:vThread,

/* A view a role has no business seeing is not merely hidden in the nav — it is
   unreachable, so a stale link or a stray action cannot land on it. */
const GATE={
  finance:()=>CAN.money==='all', accounts:()=>CAN.money==='all',
  acct:()=>!!CAN.money, invoices:()=>!!CAN.money, inv:()=>!!CAN.money,
  subsidy:()=>CAN.money==='all', claim:()=>CAN.money==='all',
  staff:()=>CAN.staff, staffm:()=>CAN.staff, scheduling:()=>CAN.staff,
  compliance:()=>CAN.compliance, settings:()=>CAN.settings, cio:()=>CAN.settings,
  rooms:()=>CAN.rooms==='all', room:()=>CAN.rooms!=='none',
  people:()=>CAN.rooms!=='none', students:()=>CAN.rooms!=='none',
  families:()=>CAN.rooms==='all', family:()=>ROLE.scope==='family'||CAN.rooms==='all',
  attendance:()=>CAN.checkin===true,     /* a parent checks in, but works no register */
};
const allowed=v=>!GATE[v]||GATE[v]();

/* On a phone the nav is five tabs and the hubs hold the rest. A rail has room

   what was a row inside Rooms, People or Finance is a destination of its own.

/* Which list a detail screen came from. On a wide screen the two sit side by
   side, because a 900px column of two-line rows is mostly empty space and you
   lose your place every time you open one. */
const SPLIT_PARENT={child:'students',family:'families',inv:'invoices',acct:'accounts',
  thread:'messages',staffm:'staff',room:'rooms',claim:'subsidy'};
const isWide=()=>window.matchMedia('(min-width:1100px)').matches;

function render(keep){
  const app=$('#app');
  const prev=app.querySelector('.col-detail .body')||app.querySelector('.body');
  const y=keep&&prev?prev.scrollTop:0;
  let want=S.sub||S.tab;
  if(!allowed(want)){S.sub=null;S.arg=null;S.tab=TABS[0][0];want=S.tab;}
  const parent=SPLIT_PARENT[want];
  const split=isWide()&&parent&&allowed(parent);
  if(split){
    const keepSub=S.sub;
    S.sub=parent; const list=(V[parent]||vHome)();
    S.sub=keepSub; const detail=(V[want]||vHome)();
    app.className='route split';
    app.innerHTML=`<div class="col-list">${list}</div><div class="col-detail">${detail}</div>`;
    /* mark the row the detail pane is showing, so the list says where you are */
    const cur=app.querySelector(`.col-list [data-act="${want}:${S.arg}"]`);
    const row=cur&&(cur.closest('.row')||cur.closest('.pcard')||cur);
    if(row)row.classList.add('picked2');
  } else {
    app.className='route';
    app.innerHTML=(V[want]||vHome)();
  }
  /* render() rewrites app.className outright, so anything riding on the class
     has to be put back here. While the gate is up the app stays out of sight. */
  const gate=document.getElementById('gate');
  if(gate&&!gate.hidden){app.classList.add('behind-gate');document.getElementById('tabs').classList.add('behind-gate');}
  if(!keep){app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');}
  const b=app.querySelector('.col-detail .body')||app.querySelector('.body');
  if(b&&y)b.scrollTop=y;
  tabs();
  const q=$('#q');
  if(q){
    q.oninput=e=>{S.q=e.target.value;render(true);
      const n=$('#q'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
  }
  const msg=$('#msg');
  if(msg){
    msg.oninput=e=>{S.draft=e.target.value;};
    msg.onkeydown=e=>{if(e.key==='Enter')doAct(S.sub==='assistant'?'asksend':'send');};
  }
  const th=$('#app').querySelector('.body.thread');
  if(th) th.scrollTop=th.scrollHeight;
}

const PUSH=new Set(['go','child','family','staffm','acct','inv','claim','thread','room']);
function doAct(a){
  if(!a||a==='noop') return;
  const i=a.indexOf(':');
  const cmd=i<0?a:a.slice(0,i), arg=i<0?'':a.slice(i+1);
  /* anything that navigates takes the sheet with it */
  if(PUSH.has(cmd)){S.stack.push({sub:S.sub,arg:S.arg,q:S.q});closeSheet();}
  switch(cmd){
    case 'tab': S.tab=arg;S.sub=null;S.arg=null;S.stack=[];S.q='';

        const whole=inRm.length===kidsIn(rid).length;
        ACTIVITIES.unshift({id:'a'+Date.now()+rid,kid:whole?'Room':inRm[0].name,
        ini:ROLE.ini,type:draft.type,icon:ty[2],title:ty[1],by:ROLE.who,
        room:roomName(rid),rid:rid,
        at:timeStr(),on:dateStr(),
        review:false,body:draft.det||`${ty[1]} logged for ${whoLabel().toLowerCase()}.`});
      });
      closeSheet();
      toast(`Posted to ${n2} ${n2===1?'family':'families'}`);
      draft=freshDraft(); draft.t=nowT();
      render(true);break;}
    case 'cfyes':{const f=pending;confirmClose();if(f)f();break;}
    case 'cfno': confirmClose();break;
    case 'ciotab': S.cioTab=arg;render();break;
    case 'ciotog':{CIO[arg]=!CIO[arg];
      toast(`${CIO[arg]?'On':'Off'} \u00b7 saved`);render(true);break;}
    case 'ciorad':{const [k,v]=arg.split(':');
      CIO[k]=/^\d+$/.test(v)?+v:v; toast('Saved');render(true);break;}
    case 'logout': doLogout();break;
    case 'soon': toast(esc(arg));break;
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){e.preventDefault();doAct(el.dataset.act);return;}
  if(e.target.id==='scrim') closeSheet();
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('#confirmwrap')){confirmClose();return;} closeSheet();});

/* clock */
(function clock(){
  const t=$('#clock');
  if(t) t.textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s?(AM|PM)/,'');
  setTimeout(clock,30000);
})();

/* mark the live role in the switcher, and grey what is not built yet */
(function(){
  document.querySelectorAll('.rolesw a').forEach(a=>{
    const r=a.dataset.role;
    if(r===ROLE.id)a.classList.add('on');
  });
  document.title=`FCM ${ROLE.label}, ${CENTER.name}`;
})();

/* the layout is a different shape either side of 1100, so redraw when it crosses */
(function(){let wide=isWide(), rail=isRail();
  window.addEventListener('resize',()=>{const w=isWide(), r=isRail();
    if(w!==wide||r!==rail){wide=w;rail=r;render();}});
})();

/* ============================================================
   FUS-19. The log-in gate. One page, and nothing else asked.
   The button is always live: a tap with an empty field returns a validation
   error rather than sitting there dimmed, because a control you cannot use
   tells you nothing about why.
   The error names NEITHER field. Saying which half was wrong tells an attacker
   that the other half was right, so the message sits above both and both
   borders go red, the way FUS-20 draws it.
   ============================================================ */
const GATE_EL=$('#gate');
let gateStay=true;

const TICK=ic('check','','#fff','3.2');
function gateError(msg){
  $('#gbanner').innerHTML=msg?`<div class="fcm-banner" role="alert">
    <span class="bn-i">${ic('alert','ic sm','currentColor','1.8')}</span>
    <p class="bn-t">${esc(msg)}</p></div>`:'';
  ['#guserbox','#gpwbox'].forEach(sel=>$(sel).classList.toggle('is-error',!!msg));
  ['#guser','#gpw'].forEach(sel=>{
    const el=$(sel);
    if(msg){el.setAttribute('aria-invalid','true');}else{el.removeAttribute('aria-invalid');}
  });
}
function setStay(on){
  gateStay=on;
  $('#gstay').setAttribute('aria-checked',String(on));
  const cb=$('#gstaycb');
  cb.classList.toggle('on',on);
  cb.innerHTML=on?TICK:'';
}
function setEye(shown){
  const eye=$('#geye');
  $('#gpw').type=shown?'text':'password';
  eye.setAttribute('aria-pressed',String(shown));
  eye.setAttribute('aria-label',shown?'Hide password':'Show password');
  eye.innerHTML=ic(shown?'eyeoff':'eye','ic sm','currentColor','1.8');
}
function showGate(){
  if(!GATE_EL) return;
  closeSheet();
  const busy=$('#gbusy'); if(busy)busy.remove();
  $('#gateform').hidden=false;
  $('.authfoot').hidden=false;
  $('#app').classList.add('behind-gate'); $('#tabs').classList.add('behind-gate');
  $('#guser').value=''; $('#gpw').value='';
  setEye(false); setStay(true); gateError('');
  GATE_EL.hidden=false;
}
function doLogout(){ showGate(); }

function doLogin(){
  const u=($('#guser').value||'').trim(), pw=$('#gpw').value||'';
  if(!u||!pw){
    gateError('Enter your username or email and your password.');
    (!u?$('#guser'):$('#gpw')).focus();
    return;
  }
  gateError('');
  $('#gateform').hidden=true;
  $('.authfoot').hidden=true;
  /* the one moment the tenant is being resolved, and nothing is asked for it */
  GATE_EL.insertAdjacentHTML('beforeend',
    `<div class="gbusy" id="gbusy"><div class="gspin" aria-hidden="true"></div>
      <h1 class="auth-h" role="status" style="margin:0">Logging you in</h1></div>`);
  setTimeout(()=>{
    const b=$('#gbusy'); if(b)b.remove();
    GATE_EL.hidden=true;
    $('#app').classList.remove('behind-gate'); $('#tabs').classList.remove('behind-gate');
    render();
    toast(`Logged in as ${ROLE.label}`);
  },900);
}

if(GATE_EL){
  setEye(false); setStay(true);
  $('#gbtn').addEventListener('click',doLogin);
  $('#geye').addEventListener('click',()=>{setEye($('#gpw').type==='password');$('#gpw').focus();});
  $('#gstay').addEventListener('click',()=>setStay(!gateStay));
  ['guser','gpw'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    if(id==='guser'){$('#gpw').focus();}else{doLogin();}
  }));
  /* ?loggedin=1 skips the gate, so a deep link into a screen still lands there */
  if(new URLSearchParams(location.search).get('loggedin')!=='1') showGate();
}

render();
</script>
