/* Activities on a desktop: the base app's anatomy, our components. Page header,
   scope band, two tabs, then the feed across the width in two columns. */
function vActivitiesWide(){
  const scope=visibleActivities();
  const q=S.q.trim().toLowerCase();
  const pend=scope.filter(a=>a.review), posted=scope.filter(a=>!a.review);
  const tab=S.actTab==='pending'?'pending':'log';
  const base=tab==='pending'?pend:posted;
  const list=base.filter(a=>(!S.actFilter.size||S.actFilter.has(a.type))
    &&(!q||(a.title+' '+a.body+' '+a.kid+' '+TY[a.type].label).toLowerCase().includes(q)));
  const fc=S.actFilter.size;
  return `<div class="body wide narrow">
   <div class="pagehead">
    ${wideBack()}
    <div><h2 class="greet-h">Activities</h2></div>
    <div class="pageacts">
     <button class="primary q" data-act="sheet:posttype">${ic('plus','ic sm','var(--npds-blue-700)','1.9')}Post activity</button>
     <span class="pagechrome">${maskBtn()}
      <button class="avatar" data-act="hmenu:role" aria-label="Account and role">${ROLE.ini}</button>${S.hmenu==='role'?hmenu('role'):''}</span>
    </div>
   </div>
   <div class="scopeband">
    <span class="scope-n">${m(CAN.rooms==='all'?'All rooms':roomName(ROLE.room))}<em>${KIDS.filter(k=>inRoom(k.room)).length}</em></span>
    <span class="datebar">
     <button class="sp-b" data-act="day:-1" aria-label="Previous day">${ic('left','ic sm')}</button>
     <span class="d-lbl">${ic('cal','ic sm','var(--ink-3)')}${dayLabel(S.day)}</span>
     <button class="sp-b${S.day>=0?' off':''}" data-act="${S.day>=0?'noop':'day:1'}" aria-label="Next day">${ic('right','ic sm')}</button>
    </span>
    <span class="band-r">
     ${searchbox('Search activities')}
     <button class="second xs${fc?' on':''}" data-act="sheet:filters">${ic('filter','ic sm','currentColor','2')}Filters${fc?' ('+fc+')':''}</button>
    </span>
   </div>
   <div class="htabs">
    <button class="htab${tab==='log'?' on':''}" data-act="acttab:log">Activity log<em>${posted.length}</em></button>
    <button class="htab${tab==='pending'?' on':''}" data-act="acttab:pending">Waiting on sign-off<em>${pend.length}</em></button>
   </div>
   <div class="feedgrid">${list.length?list.map(acard).join('')
     :'<div class="card" style="grid-column:1/-1"><div class="empty">Nothing matches.</div></div>'}</div>
  </div>`;
}
function vActivities(){
  if(ROLE.scope==='family') return vParentDay();
  if(isRail()) return vActivitiesWide();
  const q=S.q.trim().toLowerCase();
  const scope=visibleActivities();
  const list=scope.filter(a=>(!S.actFilter.size||S.actFilter.has(a.type))
    &&(!q||(a.title+' '+a.body+' '+a.kid+' '+TY[a.type].label).toLowerCase().includes(q)));
  const postbtn=`<button class="primary" data-act="sheet:posttype">${ic('plus','ic','currentColor','1.9')}Post activity</button>`;
  return `${topbar('Activities','',
   `${searchBtn()}${filtersBtn('activities')}`)}
  <div class="body">
   ${S.searchOpen?postbtn:''}
   ${datespine()}
   ${qchips()}
   <div class="feedhd lab"><b>Activity log</b><span>${scope.length} posts</span></div>
   <div class="pfeed${S.searchOpen?' short':''}">${list.length?list.map(acard).join('')
     :'<div class="card"><div class="empty">Nothing matches.</div></div>'}</div>
  </div>
  ${S.searchOpen?'':`<div class="fabdock">${postbtn}</div>`}
  ${dock(list.length,scope.length,'entry','entries','Search activities')}`;
}
/* Messages on a desktop: the list and the conversation stand side by side, the
   way the base app has them, with the scope band and the audience tabs above. */
function vMessagesWide(){
  const q=S.q.trim().toLowerCase();
  const scope=visibleThreads();
  const n=k=>scope.filter(t=>t.scope===k).length;
  const list=scope.filter(t=>(msgAll()||S.msgSel.has(t.scope))
    &&(!q||(t.who+' '+t.sub+' '+t.msgs.map(x=>x.t).join(' ')).toLowerCase().includes(q)));
  const unread=scope.filter(t=>t.unread).length;
  const open=list.find(t=>t.id===S.arg)||list[0];
  const chip=(id,lbl,c)=>`<button class="tp${(id==='all'?msgAll():S.msgSel.size===1&&S.msgSel.has(id))?' on':''}" data-act="msgs:${id}">${lbl} ${c}</button>`;
  return `<div class="body wide msgwide">
   <div class="pagehead">
    ${wideBack()}
    <div><h2 class="greet-h">Messages</h2></div>
    <div class="pageacts">
     <button class="primary q" data-act="newmsg">${ic('plus','ic sm','var(--npds-blue-700)','1.9')}New message</button>
     <button class="second q" data-act="soon:Templates">${ic('doc','ic sm','var(--npds-gray-700)','1.9')}Templates</button>
     <span class="pagechrome">${maskBtn()}
      <button class="avatar" data-act="hmenu:role" aria-label="Account and role">${ROLE.ini}</button>${S.hmenu==='role'?hmenu('role'):''}</span>
    </div>
   </div>
   <div class="scopeband">
    <span class="scope-n">${m(CAN.rooms==='all'?'All rooms':roomName(ROLE.room))}<em>${scope.length}</em></span>
    <div class="tabpill fill">${chip('all','All',scope.length)}${chip('family','Parents',n('family'))}${chip('staff','Staff',n('staff'))}</div>
    <span class="band-r">${searchbox('Search messages')}</span>
   </div>
   <div class="card msgpanes">
    <div class="msg-list">${list.length?list.map(t=>`
      <button class="msg-row${open&&t.id===open.id?' on':''}" data-act="thread:${t.id}">
       <span class="av">${m(t.ini)}${t.unread?'<i class="unreaddot"></i>':''}</span>
       <span class="rt"><b>${m(t.who)}</b><small>${m(t.sub)}</small>
        <small class="msg-last">${m(t.msgs[t.msgs.length-1].t)}</small></span>
       <span class="msg-at">${t.at}${t.unread?'<em class="unreadpip" aria-label="Unread"></em>':''}</span>
      </button>`).join(''):'<div class="empty">No messages match.</div>'}
    </div>
    <div class="msg-pane">${open?`
     <div class="msg-h"><span class="av lg">${m(open.ini)}</span>
      <span class="rt"><b>${m(open.who)}</b><small>${m(open.sub)}</small></span>
      <button class="dotsb" data-act="soon:Thread options" aria-label="More">${ic('dots','ic','var(--ink-3)','1.9')}</button></div>
     <div class="msg-body">
      <div class="daymark">Today</div>
      ${open.msgs.map(msg=>`<div class="bub ${msg.d}"><p>${esc(msg.t)}</p><span class="bt">${msg.at}</span></div>`).join('')}
     </div>
     <div class="composer">
      <input class="cinput" id="msg" placeholder="Message ${open.who.split(' ')[0]}" value="${esc(S.draft)}">
      <button class="csend" data-act="send" aria-label="Send">${ic('send','ic sm','var(--npds-blue-700)','1.8')}</button>
     </div>`:'<div class="empty">Pick a conversation.</div>'}
    </div>
   </div>
  </div>`;
}
function vMessages(){
  if(isRail()&&ROLE.scope!=='family') return vMessagesWide();
  const q=S.q.trim().toLowerCase();
  const scope=visibleThreads();
  const n=k=>scope.filter(t=>t.scope===k).length;
  const list=scope.filter(t=>(msgAll()||S.msgSel.has(t.scope))
    &&(!q||(t.who+' '+t.sub+' '+t.msgs.map(x=>x.t).join(' ')).toLowerCase().includes(q)));
  const chip=(id,lbl,c)=>`<button class="tp${(id==='all'?msgAll():S.msgSel.size===1&&S.msgSel.has(id))?' on':''}" data-act="msgs:${id}">${lbl} ${c}</button>`;
  const unread=scope.filter(t=>t.unread).length;
  const newbtn=`<button class="primary" data-act="newmsg">${ic('plus','ic','currentColor','1.9')}New message</button>`;
  /* A parent has one counterpart — the centre — so there is nothing to sort by.
     Sorting mail by sender is a job for whoever receives mail from everyone. */
  const par=ROLE.scope==='family';
  return `${topbar('Messages',unread?`${unread} waiting on you`:'All caught up',
   `${searchBtn()}${par?'':filtersBtn('messages')}`)}
  <div class="body">
   ${S.searchOpen?newbtn:''}
   ${par?'<div class="flabel">Inbox</div>'
     :`<div class="tabpill fill">${chip('all','All',scope.length)}${chip('family','Parents',n('family'))}${chip('staff','Staff',n('staff'))}</div>`}
   <div class="card list">${list.length?list.map(t=>{
     const w=par&&t.with?t.with:null;      /* who the viewer is talking to */
     return `<button class="row" data-act="thread:${t.id}">
     <span class="av">${m(w?w.ini:t.ini)}${t.unread?'<i class="unreaddot"></i>':''}</span>
     <span class="rt"><b>${m(w?w.name:t.who)}</b><small>${m(w?w.role:t.sub)} · “${m(t.msgs[t.msgs.length-1].t)}”</small></span>
     <span class="rr"><span class="tm mute">${t.at}</span></span></button>`;}).join('')
    :'<div class="empty">No messages match.</div>'}</div>
   ${par?'<p class="hint">Replies always reach the room. Your full history stays searchable.</p>':''}
  </div>
  ${S.searchOpen?'':`<div class="fabdock">${newbtn}</div>`}
  ${dock(list.length,scope.length,'thread','threads','Search messages')}`;
}
function vThread(){
  if(isRail()&&ROLE.scope!=='family') return vMessagesWide();
  const t=THREADS.find(x=>x.id===S.arg);
  if(!t) return vMessages();
  /* a thread that is not yours does not open */
  if(!visibleThreads().some(x=>x.id===t.id)) return denied('That conversation');
  /* the messages are stored from the centre's side, so a parent reading the
     same thread sees their own words on the right, not the left */
  const par=ROLE.scope==='family';
  const w=par&&t.with?t.with:null;
  const side=d=>par?(d==='in'?'out':'in'):d;
  return `${topbar(m(w?w.name:t.who),m(w?w.role:t.sub))}
  <div class="body thread">
   <div class="daymark">Today</div>
   ${t.msgs.map(msg=>`<div class="bub ${side(msg.d)}"><p>${esc(msg.t)}</p><span class="bt">${msg.at}</span></div>`).join('')}
  </div>
  <div class="composer">
   <input class="cinput" id="msg" placeholder="Message ${t.who.split(' ')[0]}" value="${esc(S.draft)}">
   <button class="csend" data-act="send" aria-label="Send">${ic('send','ic sm','var(--npds-blue-700)','1.8')}</button>
  </div>`;
}

/* People on a desktop: the base app's three tabs over one table, with the
   numbers above it. A teacher gets the same screen scoped to their room. */

  const head=(title,addLbl,addAct)=>`
   <div class="pagehead">
    ${wideBack()}
    <div><h2 class="greet-h">${title}</h2></div>
    <div class="pageacts">
     ${addLbl?`<button class="primary q" data-act="${addAct}">${ic('plus','ic sm','var(--npds-blue-700)','1.9')}${addLbl}</button>`:''}
     <span class="pagechrome">${maskBtn()}

   </div>`:'';

     ${searchbox(ph)}

     <button class="second xs" data-act="sheet:more">${ic('grid4','ic sm','currentColor','1.8')}Columns</button>
    </div></div>`;

  if(tab==='students'){
    const list=mine.filter(k=>!q||k.name.toLowerCase().includes(q)).slice().sort((a,b)=>a.name.localeCompare(b.name));

    return `<div class="body wide">
     ${head(CAN.rooms==='all'?'People':'My students',CAN.enroll?'Add student':'','soon:Add student')}

     <div class="statrow three">
      <div class="card stat tight"><span class="stat-lbl">Enrolled</span><span class="stat-v">${m(mine.length)}</span></div>
      <div class="card stat tight"><span class="stat-lbl">In right now</span><span class="stat-v" style="color:var(--present)">${m(here(mine))}</span></div>
      <div class="card stat tight"><span class="stat-lbl">Allergies</span><span class="stat-v" style="color:${alg?'var(--warn)':'inherit'}">${m(alg)}</span></div>
     </div>
     <div class="card table-card">
      ${toolbar('Search students')}
      <table class="dtable att">
       <thead><tr><th class="c-stu">Student</th><th class="c-room">Room</th><th class="c-st">Status</th>
        <th class="c-alg">Allergy</th><th class="c-note">Family</th><th class="c-act rt">Actions</th></tr></thead>
       <tbody>${list.length?list.map(k=>`<tr data-act="child:${k.id}">
         <td><span class="it"><span class="av">${m(k.ini)}${statusDot(k)}</span>
           <span class="it-t"><b>${m(k.name)}</b><small>${k.age}</small></span></span></td>
         <td class="mute">${m(roomName(k.room))}</td>
         <td><span class="pillv ${k.status==='here'?'':k.status==='absent'?'warn':'mute'}">${

         <td>${k.allergy?`<span class="pillv alg">${m(k.allergy)}</span>`:'<span class="mute">None</span>'}</td>
         <td class="mute">${m(F(k.fam).name)}</td>
         <td class="rt"><span class="rowacts">

        :'<tr><td colspan="6"><div class="empty">No students match.</div></td></tr>'}</tbody>

  if(tab==='families'){

  const list=STAFF.filter(st=>!q||st.name.toLowerCase().includes(q)||st.role.toLowerCase().includes(q));
  return `<div class="body wide">

     <thead><tr><th class="c-stu">Name</th><th class="c-room">Role</th><th class="c-st">Room</th>

     <tbody>${list.length?list.map(st=>{const al=staffAlerts(st);
       return `<tr data-act="staffm:${st.id}">
        <td><span class="it"><span class="av">${m(st.ini)}</span>
          <span class="it-t"><b>${m(st.name)}</b><small>${m(st.email||'')}</small></span></span></td>
        <td class="mute">${st.role}</td>
        <td class="mute">${m(st.room)}</td>
        <td>${al.length?`<span class="pillv warn">${al.length} alert${al.length===1?'':'s'}</span>`:'<span class="pillv">Current</span>'}</td>
        <td class="mute">${m(st.hours)} a week</td>
        <td class="rt"><span class="rowacts">
          <button class="linkbtn" data-act="staffm:${st.id}">Open</button></span></td></tr>`;}).join('')
      :'<tr><td colspan="6"><div class="empty">No staff match.</div></td></tr>'}</tbody>
    </table>
   </div>

function secl(label,state,act,actLabel){
  return `<div class="flabel"><span style="color:var(--ink-3)">${label}${state?' · '+state:''}</span>
    ${act?`<button class="seclab-act" data-act="${act}">${ic('plus','ic sm','currentColor','2')}${actLabel}</button>`:''}</div>`;
}
function emptyRow(meaning){
  return `<div class="emptyrow"><span class="plus">${ic('plus','ic sm','var(--ink-3)','2')}</span>${meaning}</div>`;
}
function denied(what){
  return `${topbar('Not available','')}<div class="body">
   <div class="card" style="padding:22px 18px;text-align:center">
    <p style="font-size:14px;color:var(--ink-2);line-height:1.55;margin:0">
     ${what} is not part of your ${ROLE.scope==='family'?'family':'room'}.</p>
   </div>
   <button class="second" data-act="tab:${TABS[0][0]}" style="width:100%">Back to Home</button>
  </div>`;
}
function vChild(){
  const k=K(S.arg); if(!k) return allowed('students')?vStudents():vHome();
  if(!mineKid(k)) return denied(k.name);
  const d=KID_DETAIL[k.id], f=F(k.fam);
  const sibs=kidsOf(k.fam).filter(x=>x.id!==k.id);
  const unsigned=Object.entries(d.consent).filter(([,v])=>!v).length;
  const docsMissing=d.docs.filter(x=>!x.ok).length;
  const TABS=[['general','General'],['pickup','Pickup'],['custody','Custody'],['medical','Medical'],
              ['docs','Docs'],['consent','Consent'],['activity','Activity']];
  const t=S.childTab;
  const fs=rows=>`<div class="card fieldset">${rows}</div>`;
  const fr=(l,v,cls='')=>`<div class="field"><span class="fl">${l}</span><span class="fv ${cls}"><span>${v}</span></span></div>`;
  const person=(name,sub,right='')=>`<div class="row">
    <span class="av">${ic('person','ic sm','var(--ink-2)','1.8')}</span>
    <span class="rt"><b>${m(name)}</b><small>${sub}</small></span>${right}</div>`;

  let panel='';
  if(t==='general'){
    panel=fs(fr('Date of birth',dateLabel(d.dob))+fr('Age',k.age)
      +(d.preferred?fr('Preferred name',m(d.preferred)):'')
      +fr('Person ID',d.pid)+fr('Classroom',roomName(k.room))
      +fr('Enrollment',d.enrolled,'ok')+fr('Start date',d.start)
      +fr('Subsidy',k.subsidy?'TN CCAP':'Private pay'))
      +secl('Address')
      +`<div class="card fieldstack"><div class="fs2"><i>Home</i><b>${m(d.address)}</b></div></div>`
      +secl('Family',f.name)

function vFamily(){
  /* a parent opening "my family" always lands on their own, and an id from a
     stale link belonging to someone else is refused rather than rendered */
  if(ROLE.scope==='family'&&!F(S.arg)) S.arg=ROLE.fam;
  const f=F(S.arg); if(!f) return allowed('families')?vFamilies():vHome();
  if(ROLE.scope==='family'&&f.id!==ROLE.fam) return denied(f.name+' family');
  const d=FAM_DETAIL[f.id], kids=kidsOf(f.id);
  const inv=visibleInvoices().filter(i=>i.fam===f.id);
  const threads=visibleThreads().filter(t=>kids.some(k=>t.sub.includes(k.name))||t.who===f.contact);
  const TABS=[['general','General'],['students','Students'],['ledger','Ledger'],
              ['messages','Messages'],['notes','Notes'],['autopay','Autopay']];
  const t=S.famTab;
  const fr=(l,v,cls='')=>`<div class="field"><span class="fl">${l}</span><span class="fv ${cls}"><span>${v}</span></span></div>`;
  const stack=(l,v,cls='')=>`<div class="fs2"><i>${l}</i><b class="${cls}">${v}</b></div>`;
  let panel='';
  if(t==='general'){
    panel=`<div class="card fieldset">${fr('Family name',m(f.name))+fr('Primary contact',m(f.contact))
      +fr('Autopay',f.autopay?'Enrolled':'Not enrolled',f.autopay?'ok':'')}</div>`
     +secl('Contact')
     +`<div class="card fieldstack">${stack('Phone',m(f.phone))+stack('Email',m(f.email))
       +stack('Address',f.address?m(f.address):'Not on file')}</div>`
     ;
  } else if(t==='students'){
    panel=secl('Enrolled',kids.length,'soon:Add a student to this family','Add')
     +`<div class="card list tight desc">${kids.length?kids.map(kidRow).join('')
       :emptyRow('No students are enrolled under this family yet.')}</div>`;
  } else if(t==='ledger'){
    panel=`<div class="card sum">
      <span class="su"><b class="${f.balance>0?'neg':'ok'}">${m(money0(f.balance))}</b><small>BALANCE DUE</small></span>
      <span class="su"><b>${m(money0(d.monthly))}</b><small>MONTHLY</small></span>
      <span class="su"><b>${kids.length}</b><small>ENROLLED</small></span></div>`
     +secl('Activity',d.ledger.length)
     +`<div class="card list tight">${d.ledger.map(x=>`<div class="row">
       <span class="tile-i">${ic(x.type==='charge'?'receipt':'dollar','ic sm',x.type==='charge'?'var(--ink-2)':'var(--present)','1.8')}</span>
       <span class="rt"><b>${x.t}</b><small>${x.d}</small></span>
       <span class="tm ${x.type==='payment'?'':'neg'}">${x.type==='payment'?'−':'+'}${m(money0(x.a))}</span></div>`).join('')}</div>`
     +secl('Invoices',inv.length)
     +`<div class="card list tight desc">${inv.length?inv.map(invRow).join('')
       :emptyRow('Nothing has been invoiced to this family yet.')}</div>`;
  } else if(t==='messages'){
    panel=secl('Threads',threads.length||'none','newmsg','New')
     +`<div class="card list tight desc">${threads.length?threads.map(x=>`<button class="row" data-act="thread:${x.id}">
       <span class="av">${m(x.ini)}${x.unread?'<i class="unreaddot"></i>':''}</span>
       <span class="rt"><b>${m(x.who)}</b><small>${x.sub} · “${x.msgs[x.msgs.length-1].t}”</small></span>
       <span class="rr"><span class="tm mute">${x.at}</span></span></button>`).join('')
       :emptyRow('Nothing has been sent to or from this family.')}</div>`;
  } else if(t==='notes'){
    panel=secl('Internal notes',d.notes.length||'none','soon:Add a note','Add')
     +`<div class="card list tight">${d.notes.length?d.notes.map(x=>`<div class="noteitem">
       <p>${esc(x.t)}</p><small>${x.by} · ${x.at}</small></div>`).join('')
       :emptyRow('Notes here are staff-only. Families never see them.')}</div>`;
  } else {
    const sw=(on,label,sub)=>`<div class="row">
      <span class="rt"><b>${label}</b><small>${sub}</small></span>
      <span class="pillv ${on?'':'mute'}">${on?'On':'Off'}</span></div>`;
    panel=`<div class="card fieldset">${fr('Autopay',f.autopay?'Enrolled':'Not enrolled',f.autopay?'ok':'')
      +fr('Payment method',d.card?m(d.card):'None on file',d.card?'':'neg')
      +fr('Charges on',f.autopay?'1st of the month':'—')}</div>`
     +`<button class="second" data-act="soon:${f.autopay?'Change the card on file':'Enrol '+f.name+' in autopay'}" style="width:100%">

     +secl('Notifications')
     +`<div class="card list tight desc">
       ${sw(d.notify.due,'Payment due reminder','Three days before it is taken')}
       ${sw(d.notify.failed,'Failed payment alert','The moment a charge is declined')}
       ${sw(d.notify.receipt,'Payment receipt','Every time a payment goes through')}</div>`;

    <div style="padding:0 16px 16px"><div class="quick three">
     <button class="primary q" data-act="soon:Call ${f.contact}">${ic('phone','ic sm','var(--npds-blue-700)','1.9')}Call</button>
     <button class="second q" data-act="newmsg">${ic('chat','ic sm','var(--npds-gray-700)','1.9')}Message</button>
     <button class="second q" data-act="acct:${f.id}">${ic('card','ic sm','var(--npds-gray-700)','1.9')}Account</button>
    </div></div>
   </div>
   <div class="tabpill">${TABS.map(([v,l])=>`<button class="tp${t===v?' on':''}" data-act="ftab:${v}">${l}</button>`).join('')}</div>

function vFinanceWide(){
  const q=S.q.trim().toLowerCase();
  const tab=(S.sub==='invoices'||S.sub==='inv')?'invoices'
    :(S.sub==='subsidy'||S.sub==='claim')?'subsidy':'accounts';
  const openInv=INVOICES.filter(i=>invStatus(i)!=='paid').length;
  const od=INVOICES.filter(i=>invStatus(i)==='overdue').length;
  const mism=CLAIMS.reduce((n,c)=>n+c.mismatches.filter(x=>!S.resolved[x.id]).length,0);
  const head=(addLbl,addAct)=>`
   <div class="pagehead">
    ${wideBack()}
    <div><h2 class="greet-h">Finance</h2></div>
    <div class="pageacts">
     <button class="primary q" data-act="${addAct}">${ic('plus','ic sm','var(--npds-blue-700)','1.9')}${addLbl}</button>
     <button class="second q" data-act="sheet:print">${ic('doc','ic sm','var(--npds-gray-700)','1.9')}Export</button>
     <span class="pagechrome">${maskBtn()}
      <button class="avatar" data-act="hmenu:role" aria-label="Account and role">${ROLE.ini}</button>${S.hmenu==='role'?hmenu('role'):''}</span>
    </div>
   </div>`;
  const tabs=`<div class="htabs">
    <button class="htab${tab==='accounts'?' on':''}" data-act="go:accounts">Accounts<em>${FAMILIES.length}</em></button>
    <button class="htab${tab==='invoices'?' on':''}" data-act="go:invoices">Invoices<em>${openInv}</em></button>
    <button class="htab${tab==='subsidy'?' on':''}" data-act="go:subsidy">Subsidy claims<em>${CLAIMS.length}</em></button>
   </div>`;
  const toolbar=ph=>`<div class="tablebar"><div class="tablebar-r" style="margin-left:0">
     ${searchbox(ph)}
     <button class="second xs" data-act="sheet:filters">${ic('filter','ic sm','currentColor','2')}Filters</button>
     <button class="second xs" data-act="sheet:more">${ic('grid4','ic sm','currentColor','1.8')}Columns</button>
    </div></div>`;
  const stats=t=>`<div class="statrow three">${t.map(x=>
    `<div class="card stat tight"><span class="stat-lbl">${x[0]}</span>
      <span class="stat-v"${x[2]?` style="color:${x[2]}"`:''}>${x[1]}</span></div>`).join('')}</div>`;

  if(tab==='accounts'){
    const list=FAMILIES.filter(f=>!q||f.name.toLowerCase().includes(q));
    const due=FAMILIES.filter(f=>f.balance>0);
    return `<div class="body wide">
     ${head('Record payment','sheet:print')}
     ${tabs}
     ${stats([['Outstanding',m(money0(outstanding())),due.length?'var(--neg)':''],
              ['Accounts with a balance',m(due.length),''],
              ['Autopay on',m(FAMILIES.filter(f=>f.autopay).length),'']])}
     <div class="card table-card">
      ${toolbar('Search accounts')}
      <table class="dtable att">
       <thead><tr><th class="c-stu">Account</th><th class="c-room">Students</th><th class="c-st">Autopay</th>
        <th class="c-alg">Last invoice</th><th class="c-note rt">Balance</th><th class="c-act rt">Actions</th></tr></thead>
       <tbody>${list.length?list.map(f=>`<tr data-act="acct:${f.id}">
         <td><span class="it"><span class="av">${m(f.name[0])}</span>
           <span class="it-t"><b>${m(f.name)}</b><small>${m(f.contact)}</small></span></span></td>
         <td class="num">${m(kidsOf(f.id).length)}</td>
         <td>${f.autopay?'<span class="pillv">On</span>':'<span class="mute">Off</span>'}</td>
         <td class="mute">${m(INVOICES.filter(i=>i.fam===f.id).slice(-1).map(i=>i.period)[0]||'None yet')}</td>
         <td class="rt num" style="color:${f.balance>0?'var(--neg)':'var(--ink-2)'}">${m(money0(f.balance))}</td>
         <td class="rt"><span class="rowacts">
           ${f.balance>0?'<button class="linkbtn" data-act="soon:Reminder sent">Remind</button>':''}
           <button class="linkbtn" data-act="acct:${f.id}">Open</button></span></td></tr>`).join('')
        :'<tr><td colspan="6"><div class="empty">No accounts match.</div></td></tr>'}</tbody>
      </table>
     </div>
    </div>`;
  }
  if(tab==='invoices'){
    let list=visibleInvoices();
    if(S.invFilter!=='all') list=list.filter(i=>invStatus(i)===S.invFilter);
    if(q) list=list.filter(i=>i.family.toLowerCase().includes(q));
    const paid=INVOICES.filter(i=>invStatus(i)==='paid').length;
    const chip=(v,l,n)=>`<button class="tp${S.invFilter===v?' on':''}" data-act="inf:${v}">${l} ${n}</button>`;
    return `<div class="body wide">
     ${head('New invoice','newinv')}
     ${tabs}
     ${stats([['To collect',m(money0(outstanding())),od?'var(--neg)':''],
              ['Overdue',m(od),od?'var(--neg)':''],['Paid this month',m(paid),'var(--present)']])}
     <div class="card table-card">
      <div class="tablebar">
       <div class="tabpill">${chip('all','All',INVOICES.length)}${chip('open','Open',openInv-od)}
        ${chip('overdue','Overdue',od)}${chip('paid','Paid',paid)}</div>
       <div class="tablebar-r">${searchbox('Search invoices')}
        <button class="second xs" data-act="sheet:filters">${ic('filter','ic sm','currentColor','2')}Filters</button></div>
      </div>
      <table class="dtable att">
       <thead><tr><th class="c-stu">Invoice</th><th class="c-room">Family</th><th class="c-st">Status</th>
        <th class="c-alg">Due</th><th class="c-note rt">Amount</th><th class="c-act rt">Actions</th></tr></thead>
       <tbody>${list.length?list.map(i=>{const st=invStatus(i);
         return `<tr data-act="inv:${i.id}">
         <td><span class="it"><span class="it-i">${ic('receipt','ic sm','currentColor','1.8')}</span>
           <span class="it-t"><b>${i.id.toUpperCase()}</b><small>${i.period}</small></span></span></td>
         <td class="mute">${m(i.family)}</td>
         <td><span class="pillv ${st==='paid'?'':st==='overdue'?'neg':'warn'}">${
           st==='paid'?'Paid':st==='overdue'?'Past due':'Open'}</span></td>
         <td class="mute">${i.due}</td>
         <td class="rt num">${m(money0(invTotal(i)))}</td>
         <td class="rt"><span class="rowacts">
           ${st!=='paid'?`<button class="linkbtn" data-act="inv:${i.id}">Record payment</button>`:''}
           <button class="linkbtn" data-act="inv:${i.id}">Open</button></span></td></tr>`;}).join('')
        :'<tr><td colspan="6"><div class="empty">No invoices match.</div></td></tr>'}</tbody>
      </table>
     </div>
    </div>`;
  }
  return `<div class="body wide">
   ${head('Submit a claim','soon:Claim submitted')}
   ${tabs}
   ${stats([['Claim value',m(money0(CLAIMS.reduce((n,c)=>n+c.value,0))),''],
            ['To resolve',m(mism),mism?'var(--warn)':''],
            ['Claims',m(CLAIMS.length),'']])}
   <div class="card table-card">
    ${toolbar('Search claims')}
    <table class="dtable att">
     <thead><tr><th class="c-stu">Cycle</th><th class="c-room">Program</th><th class="c-st">Status</th>
      <th class="c-alg">Children</th><th class="c-note rt">Value</th><th class="c-act rt">Actions</th></tr></thead>
     <tbody>${CLAIMS.map(c=>{
       const left=c.mismatches.filter(x=>!S.resolved[x.id]).length;
       return `<tr data-act="claim:${c.id}">
        <td><span class="it"><span class="it-i">${ic('bills','ic sm','currentColor','1.8')}</span>
          <span class="it-t"><b>${c.cycle}</b><small>Due ${c.deadline}</small></span></span></td>
        <td class="mute">${c.program}</td>
        <td><span class="pillv ${c.status==='paid'?'':c.status==='submitted'?'info':left?'warn':''}">${
          c.status==='paid'?'Paid':c.status==='submitted'?'Submitted':left?left+' to fix':'Ready'}</span></td>
        <td class="num">${m(c.kids)}</td>
        <td class="rt num">${m(money0(c.value))}</td>
        <td class="rt"><span class="rowacts">
          <button class="linkbtn" data-act="claim:${c.id}">${left?'Reconcile':'Open'}</button></span></td></tr>`;}).join('')}
     </tbody>
    </table>
   </div>
  </div>`;
}
function vFinance(){
  if(isRail()&&CAN.money==='all') return vFinanceWide();
  const openInv=INVOICES.filter(i=>invStatus(i)!=='paid').length;
  const overdue=INVOICES.filter(i=>invStatus(i)==='overdue').length;
  const mism=CLAIMS.reduce((s,c)=>s+c.mismatches.filter(x=>!S.resolved[x.id]).length,0);
  return `${homehead()}<div class="body low">
   <div class="card list tight hub">
    ${hubRow('go:accounts','card','','Accounts',`${FAMILIES.length} accounts · ${m(money0(outstanding()))} outstanding`)}
   </div>
   <div class="card list tight hub">
    ${hubRow('go:invoices','receipt','','Invoices',`${openInv} open${overdue?' · '+overdue+' overdue':''}`)}
   </div>
   <div class="card list tight hub">
    ${hubRow('go:subsidy','bills','','Subsidy claims',`TN CCAP${mism?' · '+mism+' to resolve':''}`)}
   </div>
  </div>`;
}
function vAccounts(){
  if(isRail()&&CAN.money==='all') return vFinanceWide();
  const q=S.q.trim().toLowerCase();
  let list=FAMILIES;
  if(q) list=list.filter(f=>f.name.toLowerCase().includes(q));
  const due=FAMILIES.filter(f=>f.balance>0);
  return `${topbar('Accounts',`${FAMILIES.length} accounts · ${due.length} with balance`,maskBtn())}<div class="body">
   ${searchbox('Search accounts')}
   <div class="card list tight">
    ${list.map(f=>`<button class="row" data-act="acct:${f.id}">
      <span class="av">${m(f.name[0])}</span>
      <span class="rt"><b>${m(f.name)}</b><small>${kidsOf(f.id).length} enrolled · ${f.autopay?'autopay on':'no autopay'}</small></span>
      <span class="rr">
       <span class="tm ${f.balance>0?'neg':'mute'}"><b>${m(money0(f.balance))}</b><small>${f.balance>0?'due':'clear'}</small></span>
       ${ic('chev','ic sm','var(--ink-3)')}</span>
     </button>`).join('')||'<div class="empty">No accounts match.</div>'}
   </div>
  </div>`;
}
function vAccount(){
  if(CAN.money==='own'&&S.arg!==ROLE.fam) S.arg=ROLE.fam;   /* your account is the only one */
  const f=F(S.arg); if(!f) return allowed('accounts')?vAccounts():vHome();
  if(CAN.money==='own'&&f.id!==ROLE.fam) return denied(f.name+' family');
  const kids=kidsOf(f.id), monthly=kids.length*TUITION;
  const inv=visibleInvoices().filter(i=>i.fam===f.id);
  const txns=[
   {d:'Jun 1, 2026',t:'Tuition · June',type:'charge',a:monthly},
   {d:'Jun 1, 2026',t:f.autopay?'Autopay payment':'Payment received',type:'payment',a:monthly-f.balance},
   {d:'May 1, 2026',t:'Tuition · May',type:'charge',a:monthly},
   {d:'May 1, 2026',t:f.autopay?'Autopay payment':'Payment received',type:'payment',a:monthly}
  ].filter(t=>t.a>0);
  const tabs=[['activity','Activity'],['invoices','Invoices'],['setup','Setup']];
  let panel='';
  if(S.acctTab==='activity'){
    panel=`<div class="card list tight">
      ${txns.map(t=>`<div class="row">
        <span class="tile-i">${ic(t.type==='charge'?'receipt':'dollar','ic sm',t.type==='charge'?'var(--ink-2)':'var(--present)','1.8')}</span>
        <span class="rt"><b>${t.t}</b><small>${t.d}</small></span>
        <span class="tm ${t.type==='payment'?'':'neg'}">${t.type==='payment'?'−':'+'}${m(money0(t.a))}</span>
       </div>`).join('')}
     </div>`;
  } else if(S.acctTab==='invoices'){
    panel=`<div class="card list tight">${inv.map(invRow).join('')||'<div class="empty">No invoices.</div>'}</div>`;
  } else {
    panel=`<div class="card fieldset">
      <div class="field"><span class="fl">Monthly rate</span><span class="fv"><span>${m(money(monthly))}</span></span></div>
      <div class="field"><span class="fl">Autopay</span><span class="fv ${f.autopay?'ok':''}"><span>${f.autopay?'Enrolled · card on file':'Not enrolled'}</span></span></div>
      <div class="field"><span class="fl">Billing contact</span><span class="fv"><span>${m(f.contact)}</span></span></div>
      <div class="field"><span class="fl">Statement day</span><span class="fv"><span>1st of month</span></span></div>
     </div>`;
  }
  return `${topbar(m(f.name)+' account',f.balance>0?m(money(f.balance))+' due':'Balance clear',
    `${maskBtn()}<button class="dotsb" data-act="acctactions:${f.id}" aria-label="More actions">${ic('dots','ic','var(--ink-3)','1.9')}</button>`)}<div class="body">
   <div class="card sum">
    <span class="su"><b class="${f.balance>0?'neg':'ok'}">${m(money0(f.balance))}</b><small>BALANCE</small></span>
    <span class="su"><b>${m(money0(monthly))}</b><small>MONTHLY</small></span>
    <span class="su"><b>${kids.length}</b><small>ENROLLED</small></span>
   </div>
   <div class="quick">
     <button class="primary q" data-act="payment:${f.id}">${ic('dollar','ic sm','var(--npds-blue-700)','1.9')}Record payment</button>
     ${f.balance>0
       ?`<button class="second q" data-act="remind:${f.id}">${ic('mail','ic sm','var(--npds-gray-700)','1.9')}Send reminder</button>`
       :`<button class="second q" data-act="charge:${f.id}">${ic('receipt','ic sm','var(--npds-gray-700)','1.9')}Add charge</button>`}
    </div>
   <div class="seg three">${tabs.map(([v,l])=>`<button class="sg${S.acctTab===v?' on':''}" data-act="atab:${v}">${l}</button>`).join('')}</div>
   ${panel}
  </div>`;
}
function invRow(i){
  const st=invStatus(i);
  const pill=st==='void'?'<span class="pillv mute">Void</span>':st==='paid'?'<span class="pillv">Paid</span>'
    :st==='overdue'?'<span class="pillv neg">Overdue</span>':'<span class="pillv info">Open</span>';
  return `<button class="row" data-act="inv:${i.id}">
   <span class="tile-i">${ic('receipt','ic sm','var(--ink-2)','1.8')}</span>
   <span class="rt"><b>${m(i.family)} · ${i.period}</b><small>#${i.id.replace('inv-','')} · due ${i.due}</small></span>
   <span class="rr"><span class="tm"><b>${m(money0(invTotal(i)))}</b></span>${pill}</span>
  </button>`;
}
function vInvoices(){
  if(isRail()&&CAN.money==='all') return vFinanceWide();
  /* a parent's invoice list is their own */
  let list=visibleInvoices();
  if(S.invFilter!=='all') list=list.filter(i=>invStatus(i)===S.invFilter);
  const q=S.q.trim().toLowerCase();
  if(q) list=list.filter(i=>i.family.toLowerCase().includes(q));
  const open=visibleInvoices().filter(i=>invStatus(i)==='open').length;
  const od=INVOICES.filter(i=>invStatus(i)==='overdue').length;
  const paid=INVOICES.filter(i=>invStatus(i)==='paid').length;
  return `${topbar('Invoices',`${open+od} open · ${od} overdue`,maskBtn())}<div class="body">
   ${searchbox('Search invoices')}
   <div class="seg four">
    ${[['all','All',INVOICES.length],['open','Open',open],['overdue','Overdue',od],['paid','Paid',paid]].map(([v,l,n])=>
      `<button class="sg${S.invFilter===v?' on':''}" data-act="inf:${v}">${l} <b>${n}</b></button>`).join('')}
   </div>
   <div class="card list tight">${list.map(invRow).join('')||'<div class="empty">No invoices match.</div>'}</div>
   <div class="quick">
    <button class="primary q" data-act="newinv">${ic('plus','ic sm','var(--npds-blue-700)','1.9')}New invoice</button>
    <button class="second q" data-act="sheet:print">${ic('doc','ic sm','var(--npds-gray-700)','1.9')}Export</button>
   </div>
   <div style="height:8px"></div>
  </div>`;
}
function vInvoice(){
  const i=IN(S.arg); if(!i) return vInvoices();
  if(CAN.money==='own'&&i.fam!==ROLE.fam) return denied('That invoice');
  const st=invStatus(i), total=invTotal(i);
  return `${topbar('Invoice #'+i.id.replace('inv-',''),`${m(i.family)} · ${i.period}`,
    `${maskBtn()}${st!=='void'?`<button class="dotsb" data-act="invactions:${i.id}" aria-label="More actions">${ic('dots','ic','var(--ink-3)','1.9')}</button>`:''}`)}<div class="body">
   <div class="card">
    <div class="hero">
     <span class="av xl">${ic('receipt','ic lg','var(--ink-2)','1.6')}</span>
     <span class="hero-t"><b>${m(money(total))}</b><small>${st==='void'?'Voided · no longer owed':st==='paid'?'Paid in full':st==='overdue'?'Overdue since '+i.due:'Due '+i.due}</small></span>
    </div>
    <div class="flags">
     ${st==='void'?'<span class="flag">Void</span>':st==='paid'?'<span class="flag">Paid</span>'
       :st==='overdue'?`<span class="flag neg">${ic('alert','ic sm','var(--neg)','1.8')}Overdue</span>`:'<span class="flag">Open</span>'}
     <span class="flag">${ic('cal','ic sm','var(--ink-2)','1.8')}Issued ${i.issued}</span>
    </div>
   </div>
   <div class="flabel">Line items</div>
   <div class="card list tight">
    ${i.lines.map(l=>`<div class="li"><span>${l.d}${l.q>1?' × '+l.q:''}</span><b>${m(money(l.q*l.r))}</b></div>`).join('')}
    <div class="li total"><span>Total</span><b>${m(money(total))}</b></div>
   </div>
   ${st==='void'?`<div class="card" style="padding:14px 16px;display:flex;gap:10px;align-items:flex-start;background:rgba(44,49,43,.05)">
     ${ic('alert','ic sm','var(--ink-3)','1.8')}<span style="font-size:13px;line-height:1.5;color:var(--ink-2)">
     <b>Voided.</b> ${S.voided[i.id]}. It no longer counts toward the family balance.</span></div>`:''}
   ${st!=='paid'&&st!=='void'?`<div class="quick">
     <button class="primary q" data-act="markpaid:${i.id}">${ic('dollar','ic sm','var(--npds-blue-700)','1.9')}Record payment</button>
     <button class="second q" data-act="sendinv:${i.id}">${ic('send','ic sm','var(--npds-gray-700)','1.9')}Send to family</button>
    </div>`:''}
   <button class="ghost" data-act="family:${i.fam}">Open ${m(i.family)} family</button>
  </div>`;
}
function vSubsidy(){
  if(isRail()&&CAN.money==='all') return vFinanceWide();
  const open=CLAIMS.filter(c=>c.status==='reconciling').length;
  const mism=CLAIMS.reduce((s,c)=>s+c.mismatches.filter(x=>!S.resolved[x.id]).length,0);
  const total=CLAIMS.reduce((s,c)=>s+c.value,0);
  return `${topbar('Subsidy claims',`TN CCAP · ${mism} to resolve`,maskBtn())}<div class="body">
   <div class="card list tight">
    ${CLAIMS.map(c=>{
      const left=c.mismatches.filter(x=>!S.resolved[x.id]).length;
      const pill=c.status==='paid'?'<span class="pillv">Paid</span>'
        :c.status==='submitted'?'<span class="pillv info">Submitted</span>'
        :`<span class="pillv ${left?'warn':''}">${left?left+' to fix':'Ready'}</span>`;
      return `<button class="row" data-act="claim:${c.id}">
       <span class="tile-i">${ic('bills','ic sm','var(--ink-2)','1.8')}</span>
       <span class="rt"><b>${c.cycle}</b><small>${c.program} · ${c.kids} children · due ${c.deadline}</small></span>
       <span class="rr"><span class="tm"><b>${m(money0(c.value))}</b></span>${pill}</span>
      </button>`;}).join('')}
   </div>
  </div>`;
}
function vClaim(){
  const c=CL(S.arg); if(!c) return vSubsidy();
  const left=c.mismatches.filter(x=>!S.resolved[x.id]).length;
  const tabs=[['mismatches','Mismatches'],['summary','Summary']];
  let panel='';
  if(S.subTab==='mismatches'){
    panel=c.mismatches.length?`<div class="card">${c.mismatches.map(x=>{
      const done=S.resolved[x.id];
      return `<div class="mism${done?' done':''}">
       <div class="mism-top">
        <span class="av">${m(x.ini)}</span>
        <span class="mism-t"><b>${m(x.kid)}</b><small>${m(money(x.amount))} claimed</small></span>
        ${done?`<span class="pillv">${done==='accept'?'Adjusted':'Kept'}</span>`:''}
       </div>
       <div class="mism-why">${x.why}</div>
       <div class="mism-fix">${ic('sparkle','ic sm','var(--accent)','1.8')}
        <span><b>Suggested:</b> ${x.fix} · ${x.delta}</span></div>
       ${done?'':`<div class="mism-acts">
         <button class="primary q" data-act="fix:${x.id}">Accept</button>
         <button class="second q" data-act="keep:${x.id}">Keep as claimed</button>
        </div>`}
      </div>`;}).join('')}</div>`
    :'<div class="card"><div class="empty">No mismatches on this claim.</div></div>';
  } else {
    panel=`<div class="card fieldset">
      <div class="field"><span class="fl">Program</span><span class="fv"><span>${c.program}</span></span></div>
      <div class="field"><span class="fl">Cycle</span><span class="fv"><span>${c.cycle}</span></span></div>
      <div class="field"><span class="fl">Children covered</span><span class="fv"><span>${c.kids}</span></span></div>
      <div class="field"><span class="fl">Days billed</span><span class="fv"><span>${c.billed}</span></span></div>
      <div class="field"><span class="fl">Days attended</span><span class="fv ${c.billed===c.attended?'ok':'neg'}"><span>${c.attended}</span></span></div>
      <div class="field"><span class="fl">Claim value</span><span class="fv"><span>${m(money(c.value))}</span></span></div>
      <div class="field"><span class="fl">Deadline</span><span class="fv"><span>${c.deadline}</span></span></div>
     </div>`;
  }
  return `${topbar(c.cycle,`${c.program} · due ${c.deadline}`,maskBtn())}<div class="body">
   <div class="card sum">

/* ---------------------------------------------------------------------------
   MY ATTENDANCE — the parent's half of the register.

   A parent has no register, because a register is every child in a room. What
   they have is their own children's days: how many they were in, and when they
   arrived and left. Nothing here can be changed, the same way My schedule
   changes nothing. The door is still the card on the home screen.
   --------------------------------------------------------------------------- */
/* A month of days, made the same way every time from the child's own id, so a
   screenshot taken twice is the same screenshot. Absences are deliberate and
   few: a prototype that marks half the month absent teaches nothing. */
function paDays(kid,from,to){
  /* from and to are offsets from the app's Monday. Default is the month so
     far, which is what the page showed before it had a day and a week. */
  const a=from==null?-21:from, b=to==null?0:to;
  let h=0; for(const c of kid.id) h=(h*31+c.charCodeAt(0))>>>0;
  const out=[];
  for(let o=-21;o<=Math.max(b,0);o++){
    const dt=msDate(o), wd=dt.getDay(), d=dt.getDate();
    h=(h*1103515245+12345)>>>0;       /* advanced every day, so a day's draw never moves */
    if(o<a||o>b) continue;
    if(wd===0||wd===6){out.push({o,d,dt,off:true});continue;}
    if(o===0){                        /* today comes from the live record */
      out.push({o,d,dt,today:true,absent:kid.status==='absent',
        tin:kid.tin||null,tout:kid.out?(kid.tout||null):null,
        waiting:kid.status!=='here'&&kid.status!=='absent'&&!kid.out});
      continue;}
    if(o>0){out.push({o,d,dt,ahead:true});continue;}
    if(h%100<7){out.push({o,d,dt,absent:true});continue;}
    const im=25+(h>>>8)%40, om=(h>>>14)%45;
    out.push({o,d,dt,tin:`${7+Math.floor(im/60)}:${String(im%60).padStart(2,'0')} AM`,
      tout:`${3+Math.floor(om/60)}:${String(om%60).padStart(2,'0')} PM`});

const paOne=(kid,o)=>paDays(kid,o,o)[0];

  const a=paMins(r.tin), b=paMins(r.tout);

function answerFor(q){
  const s=q.toLowerCase();
  /* the assistant answers within the role's scope, and says so rather than
     refusing blankly when a question falls outside it */
  if(!CAN.money && /outstanding|owe|collect|invoice|revenue|subsidy|claim|payroll|billing/.test(s))
    return "Billing sits with the centre director — I can't see it from here. Ask me about your room's register, allergies or activities.";
  if(!CAN.staff && /staff|cert|credential|roster|payroll/.test(s))
    return "Staffing sits with the centre director. I can tell you about the children in "+roomName(ROLE.room)+" though.";
  if(CAN.rooms==='one'){
    const mine=KIDS.filter(k=>inRoom(k.room));
    if(/not checked in|who is missing|not in/.test(s)){
      const n=mine.filter(k=>k.status!=='here'&&k.status!=='absent');
      return n.length?`${n.length} not in yet: ${n.map(k=>k.name).join(', ')}.`:'Everyone in your room is checked in.';
    }
    if(/allerg/.test(s)){
      const a=mine.filter(k=>k.allergy);
      return a.length?a.map(k=>`${k.name} · ${k.allergy}`).join('. ')+'.':'No allergies recorded in your room.';
    }
    if(/posted|activit|today/.test(s)){
      const n=visibleActivities().length;
      return `${n} ${n===1?'activity has':'activities have'} been posted for ${roomName(ROLE.room)} today.`;
    }
  }
  if(s.includes('outstanding')||s.includes('owe')||s.includes('collect'))
    return `${money(outstanding())} is outstanding across ${FAMILIES.filter(f=>f.balance>0).length} families. The Garcia invoice is the only overdue one — 7 days, card declined.`;
  if(s.includes('capacity')||s.includes('room')||s.includes('full')){
    const tight=ROOMS.filter(r=>here(kidsIn(r.id))/r.cap>=.5).map(r=>r.name);
    return `No room is over ratio today. ${tight.length?tight.join(' and ')+' are the fullest.':'All rooms have open seats.'} Pre-K 4 has 3 in with 1 teacher, within limit.`;
  }
  if(s.includes('subsidy')||s.includes('ccap')||s.includes('claim')){
    const left=CLAIMS[0].mismatches.filter(x=>!S.resolved[x.id]).length;
    return left?`The May claim has ${left} unresolved ${left===1?'mismatch':'mismatches'} worth $384. Clearing them releases the claim before the Jun 15 deadline.`
      :'The May claim is clear and ready to submit to TN CCAP.';
  }
  if(s.includes('staff')||s.includes('cert')||s.includes('credential'))
    return `${alertTotal()} credential alerts. Maria Lopez's state cert and first aid both expired Jul 2025 — she is the one to handle first.`;
  if(s.includes('attendance')||s.includes('here')||s.includes('present'))
    return `${here(KIDS)} of ${KIDS.length} children are in. Jaylen Thompson is out — his mother messaged about a low fever.`;
  return `I can answer on attendance, billing, subsidy claims, staffing and compliance for ${CENTER.name}. Ask about any of those.`;
}

/* ============================================================
   PA-2. Check-in and check-out: five settings and their controls. They cannot
   all sit on one screen, so each one is a tab and the page shows the setting
   you are on. It is the page People and Finance already use, so there is nothing
   new to learn. It lands on QR code.

   NOTHING SAVES. A switch takes effect the instant it is pressed, and these
   panels are nothing but switches and radios, so there is no Done button
   anywhere in this feature.

   The controls are named apart from the page that holds them: a tab panel is a
   container, not a component, and the thing being designed is what is inside it.
   ============================================================ */
const sw=(on,name,desc)=>`<span class="fcm-switch" role="switch" aria-checked="${!!on}"${
  name?` aria-label="${name}"`:''}${desc?` aria-describedby="${desc}"`:''}></span>`;
/* two lines and a switch */
const srow2=o=>`<button class="srow two" data-act="${o.act}">
  <span class="st"><b>${o.n}</b><small>${o.s}</small></span>${sw(o.on,o.n,o.desc)}</button>`;
/* No dimmed state. Nothing in this product is drawn disabled: a control a
   director cannot use is a note, not a control, so it does not appear. */
const prow=o=>`<button class="prow" role="radio" aria-checked="${!!o.on}" data-act="${o.act}"${
  o.desc?` aria-describedby="${o.desc}"`:''}>
  <span class="rad${o.on?' on':''}"></span>
  <span class="pt"><b>${o.n}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`;
/* a card of rows. Pass a label and the card becomes the radiogroup its prows
   need: a role="radio" with no group around it names nothing. */
const scard=(r,grp)=>`<div class="card scard"${grp?` role="radiogroup" aria-label="${grp}"`:''}>${r.join('')}</div>`;
const warnbox=t=>`<div class="warnbox"><span class="wb-i">${ic('alert','ic','currentColor','1.9')}</span><p>${t}</p></div>`;

/* ONE card: the switch and the three rotation choices are one setting, so they
   are one card of rows with hairlines between them, the way every field card in
   the app reads. The rotation keeps a quiet header row, because three bare
   radios sitting under a switch do not say what they are choosing between. */
/* When the switch is off there is nothing to choose between, so the choices
   are not there. They are not drawn greyed out: nothing in this product is
   shown disabled, and a dimmed radio still reads as a thing you could press. */
/* a health question is a checkbox and not a radio: a centre can ask all three */
const crow=(n,i)=>`<button class="prow" role="checkbox" aria-checked="${!!CIO.hq[i]}" data-act="ciohq:${i}">
  <span class="cbx${CIO.hq[i]?' on':''}">${CIO.hq[i]?ic('check','ic sm','#fff','2.6'):''}</span>
  <span class="pt"><b>${n}</b></span></button>`;
/* Who should be notified: the boxed row the register and the parent card
   select with, so a chosen name is unmistakable, wrapped so the group has no
   rule between it and the switch it belongs to. */
const nrow=(rule,key,n)=>{const on=CIO.not[rule][key];
  return `<div class="optrow${on?' on':''}" role="checkbox" aria-checked="${on}" data-act="cionot:${rule}:${key}">
   <span class="cbx${on?' on':''}">${on?ic('check','ic sm','#fff','2.6'):''}</span>
   <span class="kr-t"><b>${n}</b></span></div>`;};
const notify=rule=>`<div class="optwrap"><div class="optgrp" role="group"
   aria-label="Who should be notified"><span class="lhead">Who should be notified?</span>
  ${nrow(rule,'dir','Director')}${nrow(rule,'teach','Room teacher')}</div></div>`;
/* The band: the card's own width, above the card it belongs to. role="status"
   announces it when a choice brings it up, and the control that brought it up
   points at it with aria-describedby. */
const band=(t,bid)=>`<div class="band warn" role="status"${bid?` id="${bid}"`:''}>
  <span class="bn-i">${ic('alert','ic sm','currentColor','1.9')}</span><p>${t}</p></div>`;

const qrBody=()=>
  (CIO.qr&&CIO.rot===2?band('A fixed code can be photographed and used from anywhere. Your licence '
    +'may require a code that rotates.','bn-qr'):'')
 +scard([srow2({n:'Require a QR code',s:'Parents scan a code at the centre to check in',on:CIO.qr,act:'ciotog:qr'}),
         ...(CIO.qr?[`<span class="lhead">How the code rotates</span>`,
         `<div role="radiogroup" aria-label="How the code rotates">
           ${prow({n:'Every scan',s:'A new code after every scan',on:CIO.rot===0,act:'ciorad:rot:0'})}
           ${prow({n:'Every day',s:'A new code each morning',on:CIO.rot===1,act:'ciorad:rot:1'})}
           ${prow({n:'Never',s:'One code forever',on:CIO.rot===2,act:'ciorad:rot:2',desc:CIO.rot===2?'bn-qr':null})}
          </div>`]:[])]);

/* One switch, off or on, both ends of the day. There is no check-out only
   choice: the requirement does not ask for one, and a signature that proves
   collection but not handover proves half the day. */
const sigBody=()=>
  (CIO.sig?band('If a signature cannot be collected, the check-in goes through and it is captured '
    +'later in the Signature Module.','bn-sig')
   :band('The authorized contact is still recorded at both ends of the day. Only the '
    +'signature image is not taken.','bn-sigoff'))
 +scard([srow2({n:'Require a signature',
                s:'Parent signature is taken at check-in and check-out',on:CIO.sig,
                act:'ciotog:sig',desc:CIO.sig?'bn-sig':'bn-sigoff'})]);

/* The health screen is asked at check-in and never at collection. All three
   questions are checkboxes, because a centre can ask any of them. */
const healthBody=()=>
  scard([srow2({n:'Require a health screen',
                s:'Parent needs to confirm health screening during check in',on:CIO.health,
                act:'ciotog:health'}),
         ...(CIO.health?[`<span class="lhead">What is asked</span>`,
           crow('Any fever in the last 24 hours?',0),
           crow('Any new cough, sore throat, vomiting or diarrhea?',1),
           crow('Any medication given today the room should know about?',2)]:[])]);

/* Two rules is a yes or no, so it is a switch like the other four. The third
   rule, the one based on staff in the room, is not drawn at all: a control
   nobody can choose is a note to us, not a setting for a director, and
   nothing in this product is shown disabled. */
const ratioBody=()=>
  scard([srow2({n:'Require a ratio check',
                s:'A child cannot check in if the room would go over ratio',on:CIO.ratio,
                act:'ciotog:ratio'}),
         ...(CIO.ratio?[notify('ratio')]:[])]);

/* late and unscheduled are the two arrivals, each with the notify list the
   page asks for: who is told when one happens. */
const arrBody=()=>
  (!CIO.late?band('A parent arriving after 9:00 AM sees &ldquo;Check-in is closed. We have told '
    +'the staff, please wait.&rdquo;','bn-arr')
   :!CIO.unsched?band('A parent of a child not booked for today sees &ldquo;Not scheduled for this '
    +'day. We have told the staff, please wait.&rdquo;','bn-uns'):'')
 +scard([srow2({n:'Allow late arrivals',s:'A parent can check in after 9:00 AM',on:CIO.late,
                act:'ciotog:late',desc:CIO.late?null:'bn-arr'}),
         ...(CIO.late?[notify('late')]:[]),
         srow2({n:'Allow unscheduled arrivals',s:'A child not booked for today can check in',
                on:CIO.unsched,act:'ciotog:unsched',desc:CIO.unsched?null:'bn-uns'}),
         ...(CIO.unsched?[notify('unsched')]:[])]);

/* The tab carries the SHORT label, the way the feature set writes it: QR, not
   QR code, and Ratio, not Ratio at check-in. The long name is the setting's
   name, and the topbar is already saying where you are, so spelling it out
   again in the tab only pushes the pill wider than the card under it. */
/* The All tab is the landing one: every setting's state on one screen, and a
   row is a link to that setting's tab, so the overview is also the navigation. */
const allRow=(tab,n,sub,val)=>`<button class="arow2" data-act="ciotab:${tab}">
  <span class="at"><b>${n}</b><small>${sub}</small></span>
  <span class="av2">${val}${ic('chev','ic sm','currentColor','2')}</span></button>`;
const allBody=()=>scard([
  allRow('qr','QR code',CIO.qr?(CIO.rot===0?'New code for every scan':CIO.rot===1?'A new code each morning':'One code forever'):'Parents are not asked to scan',CIO.qr?'On':'Off'),
  allRow('sig','Signature',CIO.sig?'Taken at check-in and check-out':'Parent signature is not required',CIO.sig?'On':'Off'),
  allRow('health','Health screen',CIO.health?`${CIO.hq.filter(Boolean).length} questions at check-in`:'No health screen is asked',CIO.health?'On':'Off'),
  allRow('ratio','Ratio',CIO.ratio?'A room cannot go over ratio':'Ratio check is not required',CIO.ratio?'On':'Off'),
  allRow('arr','Arrivals',CIO.late&&CIO.unsched?'Late arrivals and unscheduled arrivals are allowed'
    :CIO.late?'Late arrivals are allowed':CIO.unsched?'Unscheduled arrivals are allowed':'Neither is allowed',
    CIO.late||CIO.unsched?'On':'Off')]);

const CIOTABS=[['all','All'],['qr','QR'],['sig','Signature'],['health','Health'],
               ['ratio','Ratio'],['arr','Arrivals']];
const CIOBODY={all:allBody,qr:qrBody,sig:sigBody,health:healthBody,ratio:ratioBody,arr:arrBody};
function vCheckinSettings(){
  const t=S.cioTab;
  /* On a desktop the four settings are the page's own tabs, and the panel sits
     in the column everything else uses. The controls are identical. */
  /* On a rail this setting lives inside the two-card Settings page, so there
     is one place it can be, not two. */
  if(isRail()) return vSettings();
  return `${topbar('Check-in and check-out',CENTER.name)}<div class="body">
   <div class="tabpill scrollpill" role="tablist">
    ${CIOTABS.map(([v,l])=>`<button class="tp${t===v?' on':''}" role="tab" aria-selected="${t===v}"
      data-act="ciotab:${v}">${l}</button>`).join('')}
   </div>

   exception and who carries it. The parent is told nothing in FUS-2, and the
   rate in FUS-4, which is why this is staff only. */
function scnBanner(k){
  const fn=m(k.name.split(' ')[0]), sc=scnOf(k), L=roomLoad(k.room);
  if(sc==='unsched') return `<div class="noterow"><span class="nr-i">${ic('cal','ic sm','currentColor','1.8')}</span>
    <p><b>${fn} is not scheduled today.</b>
     <span class="rcheck">${ic('check','ic sm','currentColor','2.6')}Ratio ${L.room.ratio} holds &middot; ${L.inn+1} of ${L.room.cap}</span></p></div>`;
  if(sc==='early') return `<div class="noterow"><span class="nr-i">${ic('clock','ic sm','currentColor','1.8')}</span>
    <p><b>${fn} is scheduled from ${k.from}.</b> Before care is billed to the family at the
     ${k.rate} drop-in rate. ${m(F(k.fam).contact)} is told, and nothing is asked of this room.</p></div>`;
  return '';
}

function stashCompose(){

/* a signature is drawn, so it needs the canvas wired every time the sheet redraws */
function wirePad(){
  const c=$('#pad'); if(!c||c.dataset.on)return; c.dataset.on='1';
  const x=c.getContext('2d'); x.lineWidth=3; x.lineCap='round'; x.strokeStyle='#2C312B';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)*(c.width/r.width),(t.clientY-r.top)*(c.height/r.height)];};
  const start=e=>{drawing=true;x.beginPath();x.moveTo(...pos(e));
    draft.sig=true;S.inSig=true;$('.sigh3')?.classList.add('gone');
    /* the check-in button is enabled in place: re-rendering the sheet here
       would clear the canvas the parent is still drawing on */
    const b=$('#sheet .shfoot2 .primary, #sheet .shfoot2 .second');
    if(b&&S.pickArg&&b.dataset.act==='nosig'){
      const out=$('#sheet').dataset.kind==='signout';
      b.dataset.act=S.multi.length>1 ? `domulti:${out?'out':'in'}`
        : (out?'docheckout:':'docheckin:')+S.pickArg;}
    e.preventDefault();};
  const move=e=>{if(!drawing)return;x.lineTo(...pos(e));x.stroke();e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on','tall','formsheet','full');}

     ${ic('out','ic sm','currentColor','1.9')}Log out</button></div>`:'';
  return `<div class="hmenu" id="hmenu" style="${kind==='role'?'right:18px':'left:18px'};top:62px">

  people:()=>CAN.rooms!=='none', students:()=>CAN.rooms!=='none',
  families:()=>CAN.rooms==='all', family:()=>ROLE.scope==='family'||CAN.rooms==='all',

const isRail=()=>window.matchMedia('(min-width:1024px)').matches;

let railMini=(()=>{try{return localStorage.getItem('fcm-rail')==='mini';}catch(e){return false;}})();
function railToggle(){railMini=!railMini;

function tabs(){
  const unread=THREADS.filter(t=>t.unread).length;

    const head=isRail()?`<div class="navbrand"><span class="glyph">F</span>

     <small class="nb-d">${m(CENTER.date)}</small></span>${S.hmenu==='ctr'?hmenu('ctr'):''}</div>`;

/* Which list a detail screen came from. On a wide screen the two sit side by
   side, because a 900px column of two-line rows is mostly empty space and you
   lose your place every time you open one. */
const SPLIT_PARENT={child:'students',family:'families',inv:'invoices',acct:'accounts',
  thread:'messages',staffm:'staff',room:'rooms',claim:'subsidy'};
const isWide=()=>window.matchMedia('(min-width:1100px)').matches;

function render(keep){
  const app=$('#app');
  const prev=app.querySelector('.col-detail .body')||app.querySelector('.body');
  const y=keep&&prev?prev.scrollTop:0;
  /* A kiosk has no tabs and no account, so it short-circuits the whole router.
     Everything the parent taps after the PIN is the parent flow unchanged. */
  if(KIOSK){
    document.querySelector('.screen').classList.add('kiosk');
    app.className='route enter';
    app.innerHTML=S.kioskOpen?vKioskFamily():vKioskPin();
    document.getElementById('tabs').innerHTML='';
    return;
  }
  let want=S.sub||S.tab;
  if(!allowed(want)){S.sub=null;S.arg=null;S.tab=TABS[0][0];want=S.tab;}
  const parent=SPLIT_PARENT[want];
  const split=isWide()&&parent&&allowed(parent);
  if(split){
    const keepSub=S.sub;
    S.sub=parent; const list=(V[parent]||vHome)();
    S.sub=keepSub; const detail=(V[want]||vHome)();
    app.className='route split';
    app.innerHTML=`<div class="col-list">${list}</div><div class="col-detail">${detail}</div>`;
    /* mark the row the detail pane is showing, so the list says where you are */
    const cur=app.querySelector(`.col-list [data-act="${want}:${S.arg}"]`);
    const row=cur&&(cur.closest('.row')||cur.closest('.pcard')||cur);
    if(row)row.classList.add('picked2');
  } else {
    app.className='route';
    app.innerHTML=(V[want]||vHome)();
  }
  /* render() rewrites app.className outright, so anything riding on the class
     has to be put back here. While the gate is up the app stays out of sight. */
  const gate=document.getElementById('gate');
  if(gate&&!gate.hidden){app.classList.add('behind-gate');document.getElementById('tabs').classList.add('behind-gate');}
  if(!keep){app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');}
  const b=app.querySelector('.col-detail .body')||app.querySelector('.body');
  if(b&&y)b.scrollTop=y;
  tabs();
  /* a scrolling pill keeps the tab you are on in view, so the selection is
     never off the edge of its own bar */
  const onTab=app.querySelector('.tabpill .tp.on');
  if(onTab&&onTab.parentElement.scrollWidth>onTab.parentElement.clientWidth+1)
    onTab.scrollIntoView({block:'nearest',inline:'nearest'});
  const q=$('#q');
  if(q){
    q.oninput=e=>{S.q=e.target.value;render(true);
      const n=$('#q'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
  }
  const msg=$('#msg');
  if(msg){
    msg.oninput=e=>{S.draft=e.target.value;};
    msg.onkeydown=e=>{if(e.key==='Enter')doAct(S.sub==='assistant'?'asksend':'send');};
  }
  const th=$('#app').querySelector('.body.thread');
  if(th) th.scrollTop=th.scrollHeight;
}

const PUSH=new Set(['go','child','family','staffm','acct','inv','claim','thread','room']);
function doAct(a){
  if(!a||a==='noop') return;
  const i=a.indexOf(':');
  const cmd=i<0?a:a.slice(0,i), arg=i<0?'':a.slice(i+1);
  /* anything that navigates takes the sheet with it */
  if(PUSH.has(cmd)){S.stack.push({sub:S.sub,arg:S.arg,q:S.q});closeSheet();}
  switch(cmd){
    case 'tab': S.tab=arg;S.sub=null;S.arg=null;S.stack=[];S.q='';
      S.roomSel=new Set(CAN.rooms==='one'?[ROLE.room]:[]);S.attSel.clear();S.msgSel.clear();
      S.invFilter='all';S.searchOpen=false;S.day=0;S.actFilter.clear();closeSheet();render();break;
    case 'back':{const p=S.stack.pop();
      if(p){S.sub=p.sub;S.arg=p.arg;S.q=p.q||'';}else{S.sub=null;S.arg=null;S.q='';}
      S.searchOpen=false;
      closeSheet();S.selecting=false;S.sel.clear();render();break;}
    case 'go':
      if(!allowed(arg)){toast('Not available for your role');break;}
      S.sub=arg;S.q='';
      if(arg==='myschedule'){S.msDay=0;S.msCal=false;S.msMon=0;S.msView='week';}
      if(arg==='myattendance'){S.paDay=0;S.paMon=0;S.paView='week';S.paKid='all';}
      render();break;
    /* picking a day closes the month, so what is different about that day is
       the first thing under the band rather than the thing below the fold */
    case 'msday': S.msDay=+arg;S.msCal=false;S.msMon=0;
      if(S.msView==='month')S.msView='day';render();break;
    case 'msview': S.msView=arg;S.msCal=false;S.msMon=0;render();break;
    case 'msopen': S.msDay=+arg;S.msView='day';S.msCal=false;S.msMon=0;render();break;
    case 'toopen': TO.open=TO.open===arg?null:arg;TO.mOff=0;sheet('timeoff');break;
    case 'tomon': TO.mOff=(TO.mOff||0)+(+arg);sheet('timeoff');break;
    case 'toreason': TO.reason=arg;TO.open=null;sheet('timeoff');break;
    case 'toset':{const [which,off]=arg.split(':');const o=+off;
      TO[which]=o;
      /* a range that runs backwards is not a range, so the other end follows */
      if(which==='from'&&TO.to<o)TO.to=o;
      if(which==='to'&&TO.from>o)TO.from=o;
      TO.open=null;TO.mOff=0;sheet('timeoff');break;}
    case 'tosend':{const t=$('#tonote');if(t)TO.note=t.value.trim();
      const n=TO.to-TO.from+1;
      closeSheet();
      toast(`Request sent to ${CENTER.director} &middot; ${n} ${n===1?'day':'days'}`);break;}
    case 'pakid': S.paKid=arg;
      if(inFilters()){S.fopen=null;sheet('pafilter');}
      render();break;
    case 'paview': S.paView=arg;S.paMon=0;render();break;
    case 'paday': S.paDay=+arg;render();break;
    case 'paopen': S.paDay=+arg;S.paView='day';S.paMon=0;render();break;
    case 'pamon': S.paMon+=(+arg);render();break;
    case 'capf': S.capFilter=arg;render();break;
    case 'schtab': S.schTab=arg;S.capFilter='all';
      if(inFilters()){S.fopen=null;sheet('schfilter');}
      render();break;
    /* ---- Scheduling, every change permanent and dated ---- */
    case 'planroom': closeSheet();PL.room=arg;sheet('planroom',arg);break;
    /* ---- UC-SCH-04, 05: a child in the plan ---- */
    case 'plankid': closeSheet();{const k=K(arg);PL.room=arg;PL.sec=k.sec;PL.pat='Every week';
      PL.eff=0;PL.open=null;PL.mOff=0;}sheet('plankid',arg);break;
    case 'plsec':{const x=SECTIONS.find(y=>y.name===arg);if(x)PL.sec=x.id;PL.open=null;
      sheet('plankid',PL.room);break;}
    case 'plpat': PL.pat=arg;PL.open=null;sheet('plankid',PL.room);break;
    case 'domovekid':{const k=K(arg), to=SEC(PL.sec);
      if(!to){toast('Pick a section first','warn');break;}
      const cur=secOf(k);
      if(cur&&to.id===cur.id){toast(`${m(k.name.split(' ')[0])} is already in ${to.name}`,'warn');break;}
      if(secEn(to.id)>=to.cap){toast(`${to.name} is full`,'warn');break;}
      /* UC-SCH-09: today is never overwritten. The plan starts tomorrow. */
      const clash=k.tempRoom&&to.rid!==k.tempRoom;
      k.sec=to.id; if(!clash)k.room=to.rid; else k.planRoom=to.rid;
      closeSheet();
      toast(clash?`${m(k.name)} moves to ${to.name} from ${dLbl(1)} &middot; today is unchanged`
                 :`${m(k.name)} is in ${to.name} from ${dLbl(PL.eff)}`);
      render(true);break;}
    case 'rmkid': closeSheet();PL.why='Starting kindergarten';PL.eff=0;PL.room=arg;sheet('rmkid',arg);break;
    case 'plwhy': PL.why=arg;PL.open=null;sheet($('#sheet').dataset.kind,PL.room);break;
    case 'dormkid':{const k=K(arg), cur=secOf(k);
      KIDS.splice(KIDS.indexOf(k),1);
      if(cur){const r=ROOMS.find(x=>x.id===cur.rid);if(r)r.en=Math.max(0,r.en-1);}
      closeSheet();toast(`${m(k.name)} leaves after ${dLbl(PL.eff)} &middot; one place opens`);
      render(true);break;}
    /* ---- UC-SCH-06, 07: a staff member in the plan ---- */
    case 'planstaff': closeSheet();PL.room=arg;PL.eff=0;PL.open=null;sheet('planstaff',arg);break;
    case 'rmstaff': closeSheet();PL.why='Leaving the centre';PL.eff=0;PL.room=arg;sheet('rmstaff',arg);break;
    case 'dormstaff':{const x=ST(arg);
      const bare=ROOMS.filter(r=>!stOn(r.id).filter(y=>y.id!==x.id).length);
      if(bare.length){toast(`${andList(bare.map(r=>r.name))} ${bare.length>1?'need':'needs'} a lead first`,'warn');break;}
      STAFF.splice(STAFF.indexOf(x),1);
      ROOMS.forEach(r=>{if(r.lead===x.id)r.lead=null;});
      closeSheet();toast(`${x.name} leaves after ${dLbl(PL.eff)}`);render();break;}
    /* ---- classes and sections ---- */
    case 'plancls': closeSheet();PL.room=arg;sheet('plancls',arg);break;
    case 'addcls': closeSheet();PL.room=arg;PL.open=null;NC.name='';
      sheet('addcls',arg);break;
    case 'pcwin':{const [f,t]=arg.split(' to ');NC.from=f;NC.to=t;PL.open=null;
      keepTyped();sheet('addcls',PL.room);break;}
    case 'doaddcls':{const r=ROOMS.find(x=>x.id===arg);keepTyped();
      const nm=NC.name.trim();
      if(!nm){toast('Give the class a name','warn');break;}

      SECTIONS.push({id:'sec-'+Date.now().toString(36),cid,name:nm,cap:r.cap});
      closeSheet();toast(`${m(nm)} is in ${m(r.name)}`);render();break;}
    case 'addsec': closeSheet();PL.room=arg;PL.open=null;NSEC.name='';
      sheet('addsec',arg);break;
    case 'pseccap': NSEC.cap=+arg;PL.open=null;keepTyped();sheet('addsec',PL.room);break;
    case 'doaddsec':{const c=CLS(arg);keepTyped();

    case 'psrole': NS.role=arg;PL.open=null;keepTyped();sheet('addstaff');break;
    case 'psroom':{const r=ROOMS.find(x=>x.name===arg);NS.rid=r?r.id:null;PL.open=null;
      keepTyped();sheet('addstaff');break;}

        s:'due',cover:null,flag:null,flagBy:null,hours:38,cert:'2027-06-01',review:'2027-06-01',

      closeSheet();toast(`${NS.name} starts ${dLbl(PL.eff)}`);render();break;}
    case 'cap2':{const r=ROOMS.find(x=>x.id===arg);closeSheet();
      PL.cap=r.cap;PL.eff=0;PL.open=null;PL.mOff=0;PL.room=arg;sheet('cap2',arg);break;}

    /* nothing is ever dimmed: a confirm with nothing picked says what is missing */

    case 'note': sheet('note',arg);break;
    case 'savenote':{const k=K(arg);const t=$('#nt');k.note=t?t.value.trim():'';

    case 'notepill': S.openNote.has(arg)?S.openNote.delete(arg):S.openNote.add(arg);render(true);break;

    /* one health screen done, move to the next child and start their answers clean */

    case 'dir': S.dir=arg;sheet('inout');break;

    case 'mclock': CLK='mark';S.markOpen=!S.markOpen;sheet($('#sheet').dataset.kind||'checkout',S.pickArg);

    case 'checkin': case 'checkout':{const k=K(arg);

    case 'sheet':

    /* abandoning the sheet abandons the queue too, so a later single check-in

    case 'close': S.multi=[];S.multiHealth={};closeSheet();break;
