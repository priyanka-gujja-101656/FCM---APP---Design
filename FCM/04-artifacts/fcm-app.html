<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FCM Director App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF3D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FCM Director">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Inter:wght@400;450;500;550;600&display=swap">
<style>
  :root{
    /* the one world: a low sun over ribboned green */
    --sky-1:#FCF3D6; --sky-2:#F9E4C4; --sky-3:#E8EDF3; --sky-4:#DFEAE3;
    --sun:#FBF4BE;
    --g1:#D3E4D3; --g2:#C6DCC8; --g3:#BAD3BC; --g4:#AECBB1;
    --cr:#DFE1CE; --cr2:#D8DEC9; --gl:#9FB8A0;

    --ink:#2C312B; --ink-2:#57604F; --ink-3:#88917F;
    --line:rgba(44,49,43,.09);
    --card:rgba(255,255,255,.82);
    --present:#4E7263; --amber:#B08A56; --absent:#AAAEA3;
    --neg:#9B4A3E; --warn:#7E5C2E;
    --r-lg:24px; --r-md:16px;

    /* NPDS: the single interactive colour */
    --npds-blue-100:#e6f3fb; --npds-blue-200:#cae7fa; --npds-blue-500:#189dd2;
    --npds-blue-600:#037aa7; --npds-blue-700:#056488;
    --npds-gray-200:#e1e2e6; --npds-gray-500:#8a919f; --npds-gray-600:#6d727e; --npds-gray-700:#5a5f68;
    --accent:var(--npds-blue-700);
    --accent-line:var(--npds-blue-500);
    --npds-radius:999px;
  }

  *{box-sizing:border-box}
  /* buttons do not inherit type on their own; every row in this app is a button */
  button{font-family:inherit;font-size:inherit;color:inherit}
  html,body{margin:0;padding:0;height:100%;background:var(--sky-1);
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{overflow:hidden;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

  /* ===== shell: the app fills whatever it is given =====
     .device is the root element; it stopped being a phone frame when the
     bezel came off, and keeps its name only so the markup stays stable. */
  .device{position:fixed;inset:0;padding:0}
  .screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 20%,var(--sky-3) 45%,var(--sky-4));
    padding-top:env(safe-area-inset-top)}
  .glow{position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(253,249,212,.80),rgba(250,240,190,.26) 44%,rgba(250,240,190,0) 72%)}
  .scene{position:absolute;inset:0;pointer-events:none}
  .scene svg{display:block;width:100%;height:100%}
  .haze{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(253,252,250,.16),rgba(253,253,250,.10) 30%,rgba(252,253,250,.30) 62%,rgba(252,253,250,.52))}

  .ic{width:20px;height:20px;display:block;flex:none}
  .ic.sm{width:16px;height:16px}
  .ic.lg{width:24px;height:24px}
  .batt{width:20px;height:11px}
  .status{display:none;position:relative;z-index:3;justify-content:space-between;align-items:center;
    padding:15px 28px 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .status .right{display:flex;gap:6px;align-items:center}

  /* ===== headers ===== */
  .head{position:relative;z-index:3;padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ctr{display:flex;align-items:center;gap:10px;min-width:0}
  .glyph{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.6);display:grid;place-items:center;
    font-family:Newsreader,Georgia,serif;font-size:17px;color:var(--accent);flex:none}
  .ctr-name{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctr-sub{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
  .hr{display:flex;align-items:center;gap:8px;flex:none}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;
    font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.45);flex:none}

  .topbar{position:relative;z-index:3;padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
  .tb-btn{width:36px;height:36px;border:1px solid var(--npds-gray-500);border-radius:999px;
    background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--npds-gray-700);flex:none;font-family:inherit}
  .tb-mid{flex:1;min-width:0}
  .tb-title{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
  .tb-right{display:flex;gap:6px;align-items:center;flex:none}
  .tb-txt{background:none;border:0;font-family:inherit;font-size:12px;font-weight:600;color:var(--accent);
    display:flex;align-items:center;gap:4px;padding:6px;min-height:36px}

  /* ===== body + cards ===== */
  .route{display:flex;flex-direction:column;flex:1;min-height:0}
  .route.enter{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .body{position:relative;z-index:3;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 16px 20px;
    display:flex;flex-direction:column;gap:14px}
  .body::-webkit-scrollbar{display:none}
  /* the greeting sits lower, clear of the header */
  .body.low{padding-top:30px}
  .card{background:var(--card);backdrop-filter:blur(16px) saturate(1.05);-webkit-backdrop-filter:blur(16px) saturate(1.05);
    border-radius:var(--r-lg);border:1px solid rgba(255,255,255,.5);box-shadow:0 14px 30px -20px rgba(40,55,38,.42)}

  .greet{padding:17px 19px 16px}
  .greet h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:22px;line-height:1.26;
    letter-spacing:-.015em;margin:0 0 7px;color:var(--ink)}
  .greet p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
  .greet b{color:var(--ink);font-weight:600}

  .flabel span{color:var(--ink-3);letter-spacing:0;text-transform:none;font-size:12.5px}
  .flabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;margin:10px 2px -4px;display:flex;align-items:center;justify-content:space-between}

  /* ===== pulse: one card carries the day ===== */
  .pulse{padding:24px 22px 22px}
  .pulse-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .pulse-count{display:block;font-size:32px;font-weight:450;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
  .pulse-count em{font-style:normal;font-size:15px;color:var(--ink-3);font-weight:400}
  .pulse-label{display:block;font-size:12px;color:var(--ink-2);margin-top:9px}
  .chip{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
    background:rgba(255,255,255,.55);padding:5px 9px;border-radius:99px;white-space:nowrap;margin-top:2px}
  .chip.ok{color:var(--present);background:rgba(78,114,99,.14)}
  .bar{display:flex;gap:3px;height:6px;margin-bottom:12px}
  .bar i{border-radius:4px;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--ink-2)}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:rgba(44,49,43,.18)}
  /* the three numbers a director acts on, in one rhythm */
  .rowsplit{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
  /* option C: two by two, so every label keeps its full words */
  .rowsplit.four{grid-template-columns:repeat(2,1fr);gap:18px 0}
  .rowsplit.four .rs-b:nth-child(odd){border-left:0;padding-left:0}
  .rs-b{text-align:left;border-left:1px solid var(--line);padding:0 10px;background:none;border-top:0;border-right:0;
    border-bottom:0;font-family:inherit;color:var(--ink)}
  .rs-b:first-child{border-left:0;padding-left:0}
  .rs-b b em{font-style:normal;font-size:13px;color:var(--ink-3)}
  .rs-b b{display:block;font-size:18px;font-weight:450;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rs-b small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.35}

  /* ===== segmented ===== */
  .seg{display:grid;gap:3px;padding:4px;border-radius:999px;background:rgba(255,255,255,.5)}
  .seg.two{grid-template-columns:repeat(2,1fr)}
  .seg.three{grid-template-columns:repeat(3,1fr)}
  .seg.four{grid-template-columns:repeat(4,1fr)}
  .sg{text-align:center;font-size:12px;font-weight:500;padding:9px 4px;border-radius:999px;color:var(--ink-2);
    font-family:inherit;background:none;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sg.on{background:var(--npds-blue-100);box-shadow:inset 0 0 0 1px var(--npds-blue-500);color:var(--npds-blue-700);font-weight:500}
  .sg b{font-weight:600;font-variant-numeric:tabular-nums}

  /* ===== lists and rows ===== */
  .list{padding:8px 6px;overflow:hidden}
  .list.tight{padding:2px 6px 8px}
  .row{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:13px;
    font-family:inherit;color:var(--ink);text-align:left;width:100%;background:none;border:0}
  .row+.row{border-top:1px solid var(--line);border-radius:0}
  .row:hover{background:rgba(255,255,255,.34)}
  .row:active{transform:scale(.985)}
  .av{position:relative;width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;color:var(--ink-2);
    box-shadow:inset 0 0 0 1px rgba(44,49,43,.06)}
  .av.lg{width:44px;height:44px;font-size:14px}
  .av.xl{width:52px;height:52px;font-size:16px}
  .av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
    box-shadow:0 0 0 2px rgba(253,254,251,.94)}
  .rt{flex:1;min-width:0}
  .rt b{display:block;font-size:13px;font-weight:550;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rr{display:flex;align-items:center;gap:10px;flex:none}
  .tm{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
  .tm.mute{color:var(--ink-3)}
  .tm.accent{color:var(--accent);font-weight:600}
  .tm.neg{color:var(--neg);font-weight:600}
  .tm b{display:block;font-size:12.5px;font-weight:600}
  .tm small{display:block;font-size:10px;color:var(--ink-3);margin-top:2px;font-weight:400}
  .tile-i{width:28px;height:34px;flex:none;display:grid;place-items:center}
  .empty{text-align:center;font-size:12px;color:var(--ink-3);padding:26px 10px}

  /* status pills */
  .pillv{font-size:10.5px;font-weight:600;color:var(--present);background:rgba(78,114,99,.14);
    padding:4px 9px;border-radius:99px;white-space:nowrap}
  .pillv.warn{color:var(--warn);background:rgba(176,138,86,.2)}
  .pillv.neg{color:var(--neg);background:rgba(155,74,62,.14)}
  .pillv.info{color:var(--npds-blue-700);background:var(--npds-blue-100)}
  .primary.off{opacity:.45}
  .pillv.mute{color:var(--ink-3);background:rgba(44,49,43,.07)}
  .badgen{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--npds-blue-600);color:#fff;
    font-size:10.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .badgen.warn{background:var(--amber)}
  .badgen.neg{background:var(--neg)}

  /* ===== hub cards ===== */
  /* hub rows are list rows; the only difference is that their subtitle is a
     sentence, so it wraps rather than truncating */
  .hub .rt small{white-space:normal}

  /* ===== action items ===== */
  .act{display:flex;align-items:flex-start;gap:12px;padding:15px 12px;width:100%;text-align:left;
    font-family:inherit;color:var(--ink);background:none;border:0;border-radius:13px}
  .act+.act{border-top:1px solid var(--line);border-radius:0}
  .act:hover{background:rgba(255,255,255,.34)}
  .act-i{width:26px;height:26px;flex:none;display:grid;place-items:center;margin-top:1px}
  .act-t{flex:1;min-width:0}
  .act-t b{display:block;font-size:13px;font-weight:550;letter-spacing:-.005em;line-height:1.35}
  .act-t small{display:block;font-size:11px;line-height:1.45;color:var(--ink-3);margin-top:3px}
  .act-go{font-size:11.5px;font-weight:600;color:var(--accent);flex:none;padding-top:2px}

  /* room capacity */
  .cap{padding:16px 12px}
  .cap+.cap{border-top:1px solid var(--line)}
  .cap-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .cap-top b{font-size:13px;font-weight:550}
  .cap-top span{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .track{height:6px;border-radius:4px;background:rgba(44,49,43,.09);overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px;background:var(--present)}
  .track i.warn{background:var(--amber)}
  .cap-sub{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:10.5px;color:var(--ink-3)}

  /* ===== fields ===== */
  .fieldset{padding:6px 18px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .fl{font-size:12px;color:var(--ink-3);flex:none}
  .fv{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;text-align:right;min-width:0}
  .fv.ok{color:var(--present)}
  .fv.neg{color:var(--neg)}
  .fv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .hero{display:flex;align-items:center;gap:15px;padding:20px 20px 18px}
  .hero-t{min-width:0}
  .hero-t b{display:block;font-size:15px;font-weight:600}
  .hero-t small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .flags{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 14px}
  .flag{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;color:var(--ink-2);
    background:rgba(255,255,255,.6);padding:7px 11px;border-radius:999px}
  .flag.warn{color:var(--warn);background:rgba(176,138,86,.22)}
  .flag.neg{color:var(--neg);background:rgba(155,74,62,.13)}

  /* money summary */
  .sum{display:grid;grid-template-columns:repeat(3,1fr);padding:20px 10px}
  .su{text-align:center;border-left:1px solid var(--line)}
  .su:first-child{border-left:0}
  .su b{display:block;font-size:19px;font-weight:450;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .su b.neg{color:var(--neg)}
  .su b.ok{color:var(--present)}
  .su small{display:block;font-size:10px;color:var(--ink-3);margin-top:6px;letter-spacing:.03em}

  /* line items */
  .li{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;font-size:12.5px}
  .li+.li{border-top:1px solid var(--line)}
  .li span{color:var(--ink-2);min-width:0}
  .li b{font-weight:550;font-variant-numeric:tabular-nums;flex:none}
  .li.total{background:rgba(44,49,43,.045);font-size:13px}
  .li.total span,.li.total b{color:var(--ink);font-weight:600}

  /* mismatch */
  .mism{padding:14px}
  .mism+.mism{border-top:1px solid var(--line)}
  .mism-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .mism-t b{display:block;font-size:13px;font-weight:600}
  .mism-t small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
  .mism-why{font-size:11.5px;line-height:1.5;color:var(--ink-2);padding:10px 12px;border-radius:12px;
    background:rgba(176,138,86,.15);margin-bottom:10px}
  .mism-fix{font-size:11.5px;line-height:1.5;color:var(--ink-2);padding:10px 12px;border-radius:12px;
    background:rgba(255,255,255,.6);margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}
  .mism-fix b{color:var(--ink);font-weight:600}
  .mism-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mism.done{opacity:.62}

  /* thread */
  .thread{gap:12px;padding-top:10px}
  .daymark{text-align:center;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .bub{max-width:82%;padding:12px 15px;border-radius:19px;font-size:13px;line-height:1.5}
  .bub p{margin:0}
  .bub .bt{display:block;font-size:10px;margin-top:7px;opacity:.75;font-variant-numeric:tabular-nums}
  .bub.in{align-self:flex-start;background:rgba(255,255,255,.78);border-bottom-left-radius:7px;color:var(--ink)}
  .bub.out{align-self:flex-end;background:var(--npds-blue-600);color:#fff;border-bottom-right-radius:7px}
  .composer{position:relative;z-index:4;flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px 14px}
  .cinput{flex:1;padding:12px 15px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;
    border:0;font-family:inherit;color:var(--ink);outline:none;min-width:0}
  .cinput::placeholder{color:var(--ink-3)}
  .csend{width:44px;height:44px;border:1px solid var(--npds-gray-500);border-radius:999px;
    background:rgba(255,255,255,.92);display:grid;place-items:center;flex:none}

  /* feed */
  .fe{display:flex;align-items:flex-start;gap:12px;padding:15px 12px}
  .fe+.fe{border-top:1px solid var(--line)}
  .fi{width:30px;height:30px;border-radius:10px;flex:none;background:rgba(255,255,255,.62);display:grid;place-items:center}
  .fi.warn{background:rgba(176,138,86,.2)}
  .ft{flex:1;min-width:0}
  .ft b{display:block;font-size:13px;font-weight:550;letter-spacing:-.005em}
  .ft small{display:block;font-size:11px;line-height:1.45;color:var(--ink-3);margin-top:3px}
  .fw{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}

  /* search + chips */
  .searchbox{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:999px;
    background:rgba(255,255,255,.6)}
  .searchbox input{flex:1;border:0;background:none;font-family:inherit;font-size:13px;color:var(--ink);outline:none;min-width:0}
  .searchbox input::placeholder{color:var(--ink-3)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .ch{font-size:11.5px;font-weight:500;padding:6px 11px;border-radius:999px;white-space:nowrap;
    background:rgba(255,255,255,.5);color:var(--ink-2);border:1px solid transparent;font-family:inherit}
  .ch.on{background:var(--npds-blue-100);border-color:var(--npds-blue-500);color:var(--npds-blue-700)}

  /* buttons */
  .primary,.second,.ghost{font-family:inherit;font-weight:500;letter-spacing:0;border-radius:999px;
    min-height:48px;padding:12px 20px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .14s ease,border-color .14s ease,color .14s ease}
  .primary{background:rgba(255,255,255,.92);border:1px solid var(--npds-blue-500);color:var(--npds-blue-700)}
  .primary:hover{background:var(--npds-blue-100);border-color:var(--npds-blue-700)}
  .second{background:rgba(255,255,255,.92);border:1px solid var(--npds-gray-500);color:var(--npds-gray-700)}
  .second:hover{background:#f0f1f2;border-color:var(--npds-gray-700)}
  .primary.q,.second.q{min-height:48px;padding:12px 10px;font-size:13.5px;gap:8px}
  .ghost{min-height:36px;padding:9px 18px;font-size:13px;width:auto;margin:2px auto 0;
    background:rgba(255,255,255,.92);border:1px solid var(--npds-gray-500);color:var(--npds-gray-700)}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

  .tb-inline{width:auto;min-height:36px;padding:9px 16px;margin:0;font-size:13px}
  .mini.lbl{width:auto;min-width:0;height:36px;min-height:36px;padding:0 15px;

    color:var(--npds-blue-700);white-space:nowrap;border-radius:999px}
  .dotsb{width:34px;height:34px;border:0;background:none;display:grid;place-items:center;flex:none;padding:0}
  .unreaddot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;

  .row.att{align-items:flex-start}
  .row.att .av{margin-top:2px}
  .row.att .rt b{white-space:normal;line-height:1.3}
  .row.att .rt small{white-space:normal}
  .row.att .alg{display:inline-flex;margin-top:6px}
  .row.att .rr{padding-top:2px}
  /* the register row lets the name wrap instead of truncating */
  .row.att{align-items:flex-start}
  .row.att .av{margin-top:2px}
  .row.att .rt b{white-space:normal;line-height:1.3}
  .row.att .rt small{white-space:normal}

  .tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}

  .alg.warn{color:var(--warn);background:rgba(176,138,86,.14);box-shadow:inset 0 0 0 1px rgba(176,138,86,.5)}
  .alg.neg{color:var(--neg);background:rgba(155,74,62,.08);box-shadow:inset 0 0 0 1px rgba(155,74,62,.35)}

  .sd-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:999px;

    -webkit-tap-highlight-color:transparent;user-select:none}

  /* the greeting and the quick actions are one card, divided not separated */
  .greet-acts{margin-top:19px;padding-top:19px;border-top:1px solid var(--line)}
  .feedhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex:none;padding:4px 2px 0}

  .pfeed{display:flex;flex-direction:column;gap:12px;padding-bottom:70px}

  .pcard{background:var(--card);backdrop-filter:blur(16px) saturate(1.05);

  .pc-t b{font-size:15.5px;font-weight:550;letter-spacing:-.008em;line-height:1.25}
  .pc-t small{font-size:12px;color:var(--ink-3)}
  .pc-w{flex:none;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:13px}
  .pc-b{font-size:13px;line-height:1.45;color:var(--ink-2);margin:9px 0 0}
  .pc-f{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .pc-tags{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
  .ptag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;
    font-size:12.5px;font-weight:500;white-space:nowrap}
  .phrow{display:flex;gap:9px;margin-top:12px}

  /* ================================================================
     Ported verbatim from teacher-app-mobile.html: the TYPE SCALE block.
     The director app was built from the file's earlier rules and never
     picked up this pass, which is why every row read a size small.
     ================================================================ */
  /* ================= TYPE SCALE: legible, roomier ================= */
  .screen{font-size:15px;line-height:1.5}
  .status{font-size:14px;padding:16px 26px 0}

  .topbar{padding:16px 18px 14px;gap:12px}
  .tb-title{font-size:17px;letter-spacing:-.014em}
  .tb-sub{font-size:12.5px;margin-top:3px}
  .ghost.tb-inline{min-height:34px;padding:7px 15px;font-size:13.5px;margin:0;width:auto}

  .head{padding:18px 20px 2px}
  .room-name{font-size:15.5px}
  .room-sub{font-size:12.5px;margin-top:3px}
  .avatar{width:40px;height:40px;font-size:13.5px}

  .body{padding:10px 18px 0;gap:14px}

  .greet{padding:22px 22px 20px}

  .pulse{padding:22px 22px 22px}
  .pulse-top{margin-bottom:16px}
  .pulse-count{font-size:34px}
  .pulse-count em{font-size:16px}
  .pulse-label{font-size:13.5px;margin-top:7px}
  .chip{font-size:11.5px;padding:6px 11px}
  .bar{height:8px;margin-bottom:16px}
  .legend{font-size:12.5px;gap:8px 16px}
  .dot{width:8px;height:8px}

  .rowsplit{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:16px;
    border-top:1px solid var(--line)}
  .rs-b{text-align:center;border-left:1px solid var(--line)}
  .rs-b:first-child{border-left:0}
  .rs-b b{display:block;font-size:20px;font-weight:450;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rs-b small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:5px}
  .quick{margin-top:18px;gap:10px}

  .ahead{padding:20px 8px 12px}
  .ahead h3{font-size:12px;margin:0 0 8px;padding:0 14px}
  .moment{padding:13px 14px;gap:13px}
  .mi{width:36px;height:36px;border-radius:12px}
  .mt b{font-size:15px}
  .mt small{font-size:12.5px;margin-top:3px}
  .mw{font-size:13.5px}

  .searchbox{padding:13px 16px;gap:11px}
  .searchbox input{font-size:15px}
  .ch{font-size:13px;padding:8px 14px}
  .chips{gap:8px;padding:1px 0}
  .sg{font-size:14px;padding:10px 0}

  .list{padding:6px 6px}

  .row{padding:13px 12px;gap:13px}
  .av{width:40px;height:40px;font-size:13px}

  .rt small{font-size:12.5px;margin-top:3px}
  .rr{gap:12px}
  .tm{font-size:13.5px;min-width:42px}

  .cbx,.cbx.sq{border-radius:6px!important;width:24px;height:24px}

  .fl{font-size:13.5px}
  .fv{font-size:15px}

  .ta-l{font-size:12px;margin-bottom:9px}

  .mc-tag.staff{color:var(--npds-blue-700);background:var(--npds-blue-100)}

  .mc-prev{margin:13px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2)}

  .row.msg{padding:16px 13px;align-items:flex-start}
  .row.msg .av{margin-top:2px}
  .row.msg .rt b{font-size:15px}

  .row.msg.unread{box-shadow:inset 3px 0 0 var(--npds-blue-500)}

  .row.rowstack{gap:11px}

  .row.rowstack .mini.lbl svg{width:15px;height:15px}

  .dotsb svg{width:18px;height:18px}

  .rowwrap+.rowwrap{border-top:1px solid var(--line)}

  .flabel:has(.seclab-act){align-items:center;margin:14px 2px 2px}
  /* a profile row's subtitle is a sentence, not a data line, so it wraps */
  .card.desc .rt small,.card.desc .rt b{white-space:normal}
  /* a note is a paragraph with a byline, not a title with a subtitle */
  .noteitem{padding:15px 12px}
  .noteitem+.noteitem{border-top:1px solid var(--line)}
  .noteitem p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
  .noteitem small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:7px}
  .quick.three{grid-template-columns:repeat(3,1fr)}
  .quick.three .primary,.quick.three .second{padding:11px 4px;font-size:12.5px;gap:6px}
  /* the status badge sits on the avatar, not inside it */
  .av .stb{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;
    display:grid;place-items:center;box-shadow:0 0 0 2.5px #F5F4EF;z-index:2}
  .av .stb svg{width:11px;height:11px}
  .stb.in{background:var(--present)}
  .stb.out{background:#8A6A3C}
  .stb.na{background:#FBFAF6;box-shadow:0 0 0 2.5px #F5F4EF,inset 0 0 0 1.6px var(--absent)}
  /* 1.4.11: blue-500 measured 2.99:1 against the card and missed 3:1. blue-700 is 6.37:1 */
  .mini.lbl.pri,.primary{border-color:var(--npds-blue-700)}
  /* the room becomes a heading while the roster is every room */
  .roomhd{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;padding:15px 12px 8px;display:flex;justify-content:space-between;align-items:baseline}
  .roomhd em{font-style:normal;letter-spacing:0;text-transform:none;font-size:12.5px;font-weight:400}
  .card.list .roomhd+.row{border-top:0}
  /* the teacher app's rows are always two lines, so centring the avatar read as
     top-aligned. An allergy tag adds a third, and centre starts to sag — hold the
     avatar against the name. */
  .row.rowstack:has(.tagrow) .av{align-self:flex-start;margin-top:1px}
  /* the clock dial, ported from the teacher app */
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .clockpop{margin-top:12px;background:none;border:0;border-radius:18px;padding:0;animation:pop .18s ease}
  .cread{display:flex;align-items:center;gap:3px;justify-content:center;margin-bottom:8px;
    font-variant-numeric:tabular-nums}
  .cread b{font-size:24px;font-weight:500;color:var(--ink-3);padding:3px 9px;border-radius:9px;cursor:pointer}
  .cread b.on{color:var(--npds-blue-700);background:var(--npds-blue-100)}
  .cread span{font-size:22px;color:var(--ink-3)}
  .apw{display:flex;gap:3px;margin-left:10px;padding:3px;border-radius:11px;background:rgba(44,49,43,.055)}
  .apw i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:6px 10px;
    border-radius:8px;cursor:pointer}
  .apw i.on{background:#fff;color:var(--npds-blue-700);box-shadow:0 1px 2px rgba(40,55,38,.14)}
  #dial{width:100%;max-width:246px;display:block;margin:0 auto;touch-action:none;cursor:pointer}
  #dial .face{fill:rgba(44,49,43,.035);stroke:none}
  #dial .tk{stroke:rgba(44,49,43,.18);stroke-width:1}
  #dial .tk.big{stroke:rgba(44,49,43,.32);stroke-width:1.6}
  #dial .cn circle{fill:transparent}
  #dial .cn text{font-family:Inter,sans-serif;font-size:15px;font-weight:500;fill:var(--ink-2);text-anchor:middle}
  #dial .cn.on circle{fill:var(--npds-blue-600)}
  #dial .cn.on text{fill:#FFFDFA;font-weight:600}
  #dial .hh{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  #dial .mh{stroke:var(--npds-blue-600);stroke-width:3;stroke-linecap:round}
  #dial .pin{fill:var(--npds-blue-600)}
  /* the dial is already inside the fieldset card — it needs no card of its own */
  .gpanel:has(.clockpop){border:0;background:none;box-shadow:none;padding:0 2px 4px;
    max-height:none;overflow:visible}
  /* the month calendar, ported from the teacher app */
  .calpop{margin-top:12px;background:none;border:0;border-radius:18px;padding:0;animation:pop .18s ease}
  .calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .calhd b{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
  .cnav{width:30px;height:30px;border:0;border-radius:999px;background:rgba(44,49,43,.06);
    display:grid;place-items:center;padding:0;cursor:pointer}
  .cnav.off{opacity:.35;pointer-events:none}
  .cnav svg{width:15px;height:15px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .calgrid.head span{text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:.06em;padding-bottom:4px}
  .dc{aspect-ratio:1;display:grid;place-items:center;border-radius:999px;font-size:13.5px;
    color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;border:0;background:none;
    font-family:inherit}
  .dc.pad{pointer-events:none}
  .dc.off{color:var(--ink-3);opacity:.4;pointer-events:none}
  .dc.today{font-weight:700}
  .dc.on{background:var(--npds-blue-600);color:#FFFDFA;font-weight:600}
  .gpanel:has(.calpop){border:0;background:none;box-shadow:none;padding:0 2px 4px;
    max-height:none;overflow:visible}
  /* the role switcher lives beside the phone, never inside it */
  .rolesw{display:none}
  /* the switcher appears with the desktop bezel, so it works in a narrow preview pane */
  /* Preview only, and desktop only: one floating tab, two roles. */
  @media (min-width:768px){
    .rolesw{display:flex;align-items:center;gap:3px;position:fixed;top:14px;left:50%;
      transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.9);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(44,49,43,.1);border-radius:999px;padding:4px;
      box-shadow:0 8px 24px -16px rgba(40,55,38,.4);
      font:500 13px/1 Inter,system-ui,sans-serif}
    .rolesw a{text-decoration:none;color:var(--npds-gray-700);padding:8px 16px;border-radius:999px;
      transition:background .14s ease,color .14s ease}
    .rolesw a:hover{background:rgba(44,49,43,.055)}
    .rolesw a.on{background:var(--npds-blue-100);color:var(--npds-blue-700);font-weight:600}
  }
  /* ---- parent: the child's day ---- */
  /* one card: how they are, and how you move between them */
  .phero{padding:0}
  .phead{display:flex;align-items:center;gap:14px;width:100%;padding:18px 17px;
    background:none;border:0;font-family:inherit;text-align:left;cursor:pointer;color:inherit}
  .phero.shut .phead{padding-bottom:18px}
  .avstack{display:flex;flex:none}
  .avstack .av{width:42px;height:42px;font-size:13px}
  .avstack .av+.av{margin-left:-12px}
  .avstack .av .stb{width:17px;height:17px;box-shadow:0 0 0 2px #FBFAF6}
  .avstack .av .stb svg{width:10px;height:10px}
  .ph-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .ph-t h2{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.012em}
  .ph-t small{font-size:12.5px;color:var(--ink-3);line-height:1.4}
  .phead .rch{flex:none}
  .kidrows{display:flex;flex-direction:column;padding:0 17px 6px}
  .kidrow{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;
    border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;
    font-family:inherit;text-align:left;color:inherit}
  .kidrow.pick{cursor:pointer}
  .kidrow .av{width:38px;height:38px;font-size:12.5px;flex:none}
  /* the tick is the selector: tap it or the name to show only that child */
  .krtick{width:24px;height:24px;border-radius:999px;flex:none;display:grid;place-items:center;
    background:transparent;box-shadow:inset 0 0 0 1.6px var(--npds-gray-500);cursor:pointer}
  .kidrow.sel .krtick{background:var(--npds-blue-600);box-shadow:none}
  .krtick svg{width:13px;height:13px}
  .kr-t{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
  .kr-t b{font-size:15px;font-weight:550;letter-spacing:-.008em;line-height:1.25}
  .kr-t small{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
  .kidrow.sel .kr-t b{color:var(--npds-blue-700)}
  .kidrow .mini.lbl{flex:none;height:34px;min-height:34px;padding:0 12px;font-size:12.5px;gap:6px}
  .kidrow .mini.lbl svg{width:15px;height:15px}
  /* the parent's filter row sits a touch tighter than the staff card's */
  .qrrow.pqr{justify-content:space-between;gap:8px;margin:2px 0 2px}
  .qrrow.pqr .qr{gap:9px;font-size:13px}
  /* two children, two faces */
  .avstack{display:flex;flex:none}
  .avstack .av{width:46px;height:46px;font-size:14px}
  .avstack .av+.av{margin-left:-13px}
  .avstack .av .stb{width:19px;height:19px}
  .avstack .av .stb svg{width:11px;height:11px}
  .phero .ph-t .ph-pill+.ph-pill{margin-top:6px}
  .pcard .pc-f .mini.lbl{min-height:34px}
  .pcard .ptag{display:inline-flex;align-items:center;gap:5px}
  .phero .av.lg .stb{width:22px;height:22px;right:-2px;bottom:-2px}
  .phero .av.lg .stb svg{width:13px;height:13px}
  /* Select reads as pressed while the list is being worked */
  .ghost.tb-inline.on{background:var(--npds-blue-100);border-color:var(--npds-blue-500);
    color:var(--npds-blue-700);font-weight:600}
  /* ---- the one filter shape ---- */
  .ffield{display:flex;flex-direction:column;flex:none;margin-bottom:15px}
  .ffield>i{font-style:normal;font-size:13px;font-weight:500;color:var(--ink-2);margin:0 2px 7px}
  .fsel{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px 0 16px;
    border-radius:14px;border:1px solid var(--npds-gray-500);background:rgba(255,255,255,.86);
    font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
  .fsel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsel.pale span{color:var(--ink-3)}
  /* the shared chevron points right; a dropdown's points down, and up when open */
  .fsel svg{flex:none;transform:rotate(90deg);transition:transform .16s ease}
  .fsel.on{border-color:var(--npds-blue-500);box-shadow:inset 0 0 0 1px var(--npds-blue-500)}
  .fsel.on svg{transform:rotate(-90deg)}
  .fpanel{margin-top:8px;border:1px solid rgba(44,49,43,.12);border-radius:14px;
    background:#FFFDFA;padding:4px 12px;animation:pop .18s ease}
  .fsearch{display:flex;align-items:center;gap:9px;padding:9px 2px;
    border-bottom:1px solid var(--line)}
  .fsearch input{flex:1;min-width:0;border:0;background:none;font-family:inherit;font-size:14.5px;
    color:var(--ink);outline:none;padding:4px 0}
  .fsx{width:26px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
  .fpanel .opts,.gpanel .opts{max-height:252px}
  .fhint{margin:2px 0 8px;font-size:12px;color:var(--ink-3);padding:0 2px}
  .fbtns{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .fbtns .primary,.fbtns .ghost{width:100%;margin:0}
  /* the confirm dialog, ported from the teacher app */
  .confirmwrap{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:24px;
    opacity:0;transition:opacity .18s ease;pointer-events:none}
  .confirmwrap.on{opacity:1;pointer-events:auto}
  .cf-scrim{position:absolute;inset:0;background:rgba(28,38,26,.34);backdrop-filter:blur(2px)}
  .cf-card{position:relative;width:100%;background:rgba(253,254,251,.98);border-radius:24px;
    padding:24px 22px 20px;box-shadow:0 26px 60px -20px rgba(28,42,26,.5);
    transform:scale(.96);transition:transform .2s cubic-bezier(.32,.72,0,1)}
  .confirmwrap.on .cf-card{transform:none}
  .cf-card h4{margin:0 0 9px;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:20px;
    letter-spacing:-.015em;color:var(--ink)}
  .cf-card p{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--ink-2)}
  .cf-card .primary{margin:0;width:100%}
  .cf-card .second{margin-top:9px;width:100%}
  /* an allergy is the one tag on a register row that is a warning rather than a
     label, so it carries the negative colour the rest of the app uses for one */
  .alg{color:var(--neg);background:rgba(155,74,62,.12);
    box-shadow:inset 0 0 0 1px rgba(155,74,62,.3)}
  /* filter options are checkboxes, because every one of them takes more than
     one answer */
  .fchk{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;
    box-shadow:inset 0 0 0 1.6px var(--npds-gray-500);background:transparent}
  .fchk.on{background:var(--npds-blue-600);box-shadow:none}
  .fchk svg{width:13px;height:13px}
  .fpanel .opt,.gpanel .opt{gap:12px}
  .fpanel .opt .on2,.gpanel .opt .on2{flex:1}
  .fall{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:4px 0;
    border:0;border-bottom:1px solid var(--line);background:none;font-family:inherit;
    cursor:pointer;color:var(--npds-blue-700);font-size:14px;font-weight:600;text-align:left}
  .fall-t{flex:1;font-weight:600}
  /* ===========================================================================
     RESPONSIVE

     Three shapes, one app. Below 768 it is the phone it has always been:
     bottom tabs, one column edge to edge. From 768 the tabs become a rail down
     the side and the content takes a column with room around it. From 1100 a
     list and the thing you opened from it sit side by side, because at that
     width the alternative is a very wide list of very short rows.
     =========================================================================== */
  .shellwrap{display:contents}

    .screen>.scene,.screen>.glow,.screen>.haze{display:none}
    /* Desktop follows Daybreak, not the frozen phone values: its ink ramp,
       its 2px space scale, and a type scale one step up from the phone's. */
    .screen{
      --ink:#3B423A; --ink-2:#5D6655; --ink-3:#646B5C;
      --d-gutter:24px; --d-stack:16px; --d-card:28px; --d-row:14px;
      --d-lbl:11px; --d-th:11px; --d-td:14px; --d-name:15px; --d-sub:12.5px;
    }
    .screen{flex-direction:row}
    .status{display:none}
    /* the tabs become a rail */
    /* the rail comes first in the row, though it is last in the markup */
    .nav{order:-1;flex-direction:column;justify-content:flex-start;gap:2px;
      width:212px;flex:none;padding:14px 12px 18px;overflow-y:auto;scrollbar-width:none;
      border-top:0;border-right:1px solid rgba(255,255,255,.55);
      grid-auto-flow:row;display:flex}
    .nav a{flex-direction:row;justify-content:flex-start;gap:12px;min-height:42px;
      padding:0 12px;border-radius:12px;font-size:var(--d-name);font-weight:500;color:var(--ink-2)}
    .nav a:hover{background:rgba(255,255,255,.5)}
    .nav a.on{background:var(--npds-blue-100);font-weight:600}
    /* the icon carries its own tile, so the rail reads by symbol before word */
    .nav a .ic{width:26px;height:26px;padding:4px;border-radius:9px;
      background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1px rgba(44,49,43,.06);
      color:var(--ink-2);flex:none}
    .nav a.on .ic{background:var(--npds-blue-600);box-shadow:none;color:#FFFDFA}
    .nav .navlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav .navsec{display:block;font-size:var(--d-lbl);letter-spacing:.11em;text-transform:uppercase;
      color:var(--ink-3);font-weight:600;padding:14px 12px 5px}
    .nav .navsec:first-child{padding-top:4px}
    .navbrand{display:flex;align-items:center;gap:10px;padding:6px 10px 15px;margin-bottom:6px;
      border-bottom:1px solid var(--line);flex:none}
    .navbrand .glyph{width:30px;height:30px;border-radius:10px;font-size:15px}
    .nb-t{min-width:0}
    .nb-t b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .nav.railmin .navbrand{justify-content:center;padding:4px 0 12px}
    .nav.railmin .nb-t{display:none}
    /* the rail says where you are, so the page header no longer repeats it */
    .head .ctr{display:none}
    .head{justify-content:flex-end;padding-top:14px}
    /* More closes the list, and the toggle sits under it */
    .nav a:last-of-type{margin-top:8px}
    .railtog{margin-top:14px;display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px;
      border:0;border-radius:12px;background:rgba(255,255,255,.5);font-family:inherit;
      font-size:12.5px;font-weight:500;color:var(--ink-3);width:100%;text-align:left;flex:none}
    .railtog:hover{background:rgba(255,255,255,.8);color:var(--ink-2)}
    .railtog .ic{width:26px;height:26px;padding:5px;flex:none}
    /* collapsed: the icons alone, and the content column takes the 148px back */
    .nav.railmin{width:64px;padding:14px 8px 18px}
    .nav.railmin a,.nav.railmin .railtog{justify-content:center;padding:0;gap:0}
    .nav.railmin .navlbl{display:none}
    .nav.railmin .navsec{height:1px;padding:0;margin:9px 10px;background:var(--line);overflow:hidden}
    .nav.railmin .badge{position:absolute;top:1px;right:2px;left:auto;min-width:15px;height:15px;font-size:9px;padding:0 3px}
    /* the badge is written before the icon, which a phone hides with absolute
       positioning; in a rail it has to be sent to the end explicitly */
    .nav .badge{position:static;order:2;margin-left:auto;left:auto;top:auto}
    .nav a .ic{order:0}
    /* the content column */
    #app.route{flex:1;min-width:0;min-height:0;overflow:hidden}
    .body{max-width:760px;width:100%;margin:0 auto}
    /* the director's home is the one page that takes the whole width */
    /* the page stops before the edge, so a table is read rather than scanned
       across a metre of monitor */
    .body.wide{max-width:1200px;width:100%;margin:0 auto;
      padding:var(--d-stack) var(--d-gutter) var(--d-gutter);gap:var(--d-stack)}
    .body.wide .flabel{font-size:var(--d-lbl)}
    .body.wide .flabel span{font-size:var(--d-sub)}
    .body.wide .act{padding:var(--d-row) 16px}
    .body.wide .act-t b{font-size:var(--d-name)}
    .body.wide .act-t small{font-size:var(--d-sub)}
    .body.wide .act-go{font-size:13px}
    .body.wide .homepair .flabel{padding:0 14px}
    .body.wide .sumtile{padding:var(--d-card) 24px}
    .body.wide .sumt small{font-size:13.5px}
    .body.wide .dtable th{font-size:var(--d-th);padding:14px 14px}
    .body.wide .dtable td{font-size:var(--d-td);padding:var(--d-row) 14px}
    .body.wide .dtable td b{font-size:var(--d-name)}
    .body.wide .dtable td small{font-size:var(--d-sub)}
    .body.wide .dtable td.num{font-size:var(--d-name)}
    .body.wide .pillv{font-size:var(--d-sub)}
    .body.wide .greet-h{font-size:29px}
    .body.wide .greet-s{font-size:14px}
    /* the greeting is the page's own heading, not something inside a card */
    .body.wide{padding-top:18px}
    .body.wide .pagehead{display:flex;align-items:center;justify-content:space-between;gap:20px;
      flex:none;padding:14px 2px 4px}
    /* Hide and the account sit in the page's own header, after a divider,
       rather than floating in a row of their own */
    .body.wide .pagechrome{display:flex;align-items:center;gap:12px;margin-left:8px;padding-left:20px;
      border-left:1px solid var(--line)}
    .body.wide .pagechrome .tb-txt{min-height:40px;padding:0 15px;border-radius:999px;
      border:1px solid var(--npds-gray-500);background:rgba(255,255,255,.9);font-size:13.5px;gap:8px;
      color:var(--npds-gray-700)}
    .body.wide .pagechrome .avatar{width:40px;height:40px;font-size:13px}
    .pagehead-div{width:1px;height:26px;background:var(--line);margin:0 2px}
    .body.wide .greet-h{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:26px;
      line-height:1.22;letter-spacing:-.018em;margin:0}
    .body.wide .pageacts{display:flex;align-items:center;gap:10px;flex:none}
    .body.wide .pageacts .primary,.body.wide .pageacts .second{min-height:40px;padding:0 20px;font-size:14px;gap:9px}
    /* the two chrome controls sit together, clear of the page's own buttons */
    .head{padding:16px 24px 0}
    .head .hr{gap:12px}
    .head .tb-txt{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--npds-gray-500);
      background:rgba(255,255,255,.9);font-size:13.5px;gap:8px;color:var(--npds-gray-700)}
    .head .avatar{width:40px;height:40px;font-size:13px}
    /* every row's buttons are the one height, with the one gap */
    .body.wide .rowacts{gap:10px}
    .body.wide .primary.xs,.body.wide .second.xs{min-height:36px;padding:0 16px;font-size:13.5px}
    /* a stat card reads label, number, then the sentence under it */
    /* the numbers are a strip, not four cards: one surface, rules between */
    .body.wide .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:none;
      background:var(--card);border-radius:var(--r-lg);border:1px solid rgba(255,255,255,.5);
      box-shadow:0 14px 30px -20px rgba(40,55,38,.42);overflow:hidden}
    .body.wide .statrow .stat{background:none;border:0;border-left:1px solid var(--line);
      border-radius:0;box-shadow:none}
    .body.wide .statrow .stat:first-child{border-left:0}
    .body.wide .statrow .stat:hover{background:rgba(255,255,255,.5)}
    /* a row's action is a word, and the quiet kebab holds the rest */
    .linkbtn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 10px;border:0;
      border-radius:999px;background:none;font-family:inherit;font-size:13.5px;font-weight:600;
      color:var(--npds-blue-700);cursor:pointer}
    .linkbtn:hover{background:var(--npds-blue-100)}
    .linkbtn.big{min-height:40px;padding:0 14px;font-size:14px;font-weight:550;color:var(--npds-gray-700)}
    .linkbtn.big:hover{background:rgba(44,49,43,.055)}
    .linkbtn.strong{color:var(--npds-blue-700)}
    .body.wide .dotsb.quiet{border:0;background:none}
    .body.wide .dotsb.quiet:hover{background:rgba(44,49,43,.055)}
    .stat{display:flex;flex-direction:column;gap:11px;text-align:left;padding:18px 20px 20px;
      font-family:inherit;color:inherit}
    .stat:hover{background:rgba(255,255,255,.92)}
    .stat-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .stat-bar{display:block;height:6px;border-radius:99px;background:rgba(44,49,43,.09);overflow:hidden}
    .stat-bar i{display:block;height:100%;border-radius:99px;background:var(--present)}
    .stat-bar i.warn{background:var(--amber)}
    .stat-bar i.bad{background:var(--neg)}
    .stat-i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
      background:var(--npds-blue-100);color:var(--npds-blue-700);flex:none}
    .stat-i.ok{background:rgba(78,114,99,.14);color:var(--present)}
    .stat-i.bad{background:rgba(155,74,62,.12);color:var(--neg)}
    .stat-i.warn{background:rgba(176,138,86,.18);color:var(--warn)}
    .stat-i .ic{width:16px;height:16px}
    .stat-lbl{display:block;font-size:var(--d-lbl);letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3);font-weight:600}
    .stat-v{display:block;font-size:30px;font-weight:450;letter-spacing:-.028em;line-height:1;
      font-variant-numeric:tabular-nums}
    .stat-v em{font-style:normal;font-size:17px;color:var(--ink-3)}
    .stat-s{display:block;font-size:13px;color:var(--ink-2)}
    /* attendance on a desktop: scope band, three numbers, one table */
    .body.wide .scopeband{display:flex;align-items:center;gap:12px;flex:none;padding:0 2px}
    .scope-n{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 16px;border-radius:999px;
      border:1px solid var(--npds-gray-500);background:rgba(255,255,255,.88);font-size:var(--d-td);font-weight:550}
    .scope-n em{font-style:normal;font-size:12px;font-weight:700;color:var(--npds-blue-700);
      background:var(--npds-blue-100);border-radius:99px;padding:3px 8px;font-variant-numeric:tabular-nums}
    .body.wide .datebar{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px;
      border:1px solid var(--npds-gray-500);background:rgba(255,255,255,.88)}
    .body.wide .datebar .sp-b{width:32px;height:32px;min-height:32px;border:0;background:none}
    .body.wide .datebar .d-lbl{display:inline-flex;align-items:center;gap:8px;padding:0 10px;
      font-size:var(--d-td);font-weight:550;font-variant-numeric:tabular-nums}
    .body.wide .statrow.three{grid-template-columns:repeat(3,1fr)}
    .stat.tight{padding:16px 20px}
    .stat.tight .stat-v{font-size:28px;margin-top:6px}
    /* one fixed grid, so a name never wraps and a column never collapses */
    .dtable.att{table-layout:fixed}
    .dtable.att col{}
    .dtable.att th.selcol,.dtable.att td.selcol{width:52px;padding:12px 0 12px 20px;text-align:left;
      vertical-align:middle;line-height:1}
    .dtable.att .c-stu{width:30%}
    .dtable.att .c-room{width:13%}
    .dtable.att .c-st{width:12%}
    .dtable.att .c-alg{width:13%}
    .dtable.att .c-note{width:12%}
    .dtable.att .c-act{width:24%}
    .body.wide .rowacts button{white-space:nowrap}
    .body.wide .cbx{width:20px;height:20px;min-width:20px;border-radius:6px!important;flex:none;
      box-shadow:inset 0 0 0 1.6px var(--npds-gray-500);background:transparent;
      display:inline-grid;place-items:center;vertical-align:middle;cursor:pointer}
    .body.wide .cbx.on{background:var(--npds-blue-600);box-shadow:none}
    .body.wide .cbx .ic{width:13px;height:13px}
    /* a row is one line of each, 56px tall, and the name clips rather than wraps */
    .dtable.att td{padding:12px 16px}
    .dtable.att .it{gap:12px}
    .dtable.att .it-t{flex:1;min-width:0}
    .dtable.att .it-t b,.dtable.att .it-t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dtable.att .av{width:36px;height:36px;font-size:12px}
    /* the toolbar above the table: the state pills, then search and the tools */
    .tablebar{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
    .tablebar-r{display:flex;align-items:center;gap:10px;margin-left:auto}
    .tablebar .searchbox{width:260px;min-height:38px;margin:0}
    .tablebar .tabpill{flex:none}
    .tablebar .tp{padding:9px 15px;font-size:13.5px}
    .dtable td.selcol{cursor:pointer}
    .dtable tr.picked2 td{background:var(--npds-blue-100)}
    .bulkbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--npds-blue-100);
      border-bottom:1px solid var(--npds-blue-200);font-size:var(--d-td)}
    .bulkbar b{flex:1;color:var(--npds-blue-700);font-weight:600}
    .body.wide .dotsb{width:34px;height:34px;border-radius:999px;border:1px solid var(--npds-gray-500);
      background:rgba(255,255,255,.9);display:grid;place-items:center}
    /* messages: one card, a list and the conversation */
    .body.wide.msgwide{overflow:hidden}
    .msgpanes{display:grid;grid-template-columns:360px 1fr;flex:1;min-height:0;overflow:hidden;padding:0}
    .msg-list{border-right:1px solid var(--line);overflow-y:auto;min-height:0;padding:8px;scrollbar-width:none}
    .msg-list::-webkit-scrollbar{display:none}
    .msg-row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;
      border:0;border-radius:14px;background:none;font-family:inherit;color:inherit;cursor:pointer}
    .msg-row:hover{background:rgba(255,255,255,.6)}
    .msg-row.on{background:var(--npds-blue-100)}
    .msg-row .rt{flex:1;min-width:0}
    .msg-row .rt b{display:block;font-size:var(--d-name);font-weight:550;color:var(--ink)}
    .msg-row .rt small{display:block;font-size:var(--d-sub);color:var(--ink-3);margin-top:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-row .msg-last{color:var(--ink-2);margin-top:5px}
    .unreadpip{width:9px;height:9px;border-radius:99px;background:var(--npds-blue-600);display:block}
    .msg-at{flex:none;font-size:12px;color:var(--ink-3);text-align:right;display:flex;flex-direction:column;
      align-items:flex-end;gap:7px;font-variant-numeric:tabular-nums}
    .msg-pane{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
    .msg-h{display:flex;align-items:center;gap:13px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
    .msg-h .rt{flex:1;min-width:0}
    .msg-h .rt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
    .msg-h .rt small{display:block;font-size:var(--d-sub);color:var(--ink-3);margin-top:3px}
    .msg-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;
      gap:10px;scrollbar-width:none}
    .msg-body::-webkit-scrollbar{display:none}
    .msg-pane .composer{position:static;flex:none;padding:14px 20px 16px;border-top:1px solid var(--line);
      background:none;box-shadow:none}
    .msg-pane .bub{max-width:62%}
    /* the feed takes the width in two columns, and scrolls as one */
    .body.wide.narrow{max-width:880px}
    .body.wide .feedgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--d-stack);
      align-content:start;overflow-y:auto;min-height:0;padding-bottom:4px;scrollbar-width:none}
    .body.wide .feedgrid::-webkit-scrollbar{display:none}
    .body.wide .feedgrid .pcard{margin:0}
    .body.wide .scopeband .band-r{display:flex;align-items:center;gap:10px;margin-left:auto}
    .body.wide .scopeband .searchbox{width:260px;min-height:38px;margin:0}
    .second.xs.on{border-color:var(--npds-blue-500);color:var(--npds-blue-700);background:var(--npds-blue-100)}
    /* the two lists are one table behind two tabs */
    .body.wide .htabs{display:flex;gap:26px;flex:none;border-bottom:1px solid var(--line);padding:0 4px;margin-top:4px}
    .htab{background:none;border:0;font-family:inherit;font-size:var(--d-td);font-weight:550;color:var(--ink-2);
      padding:0 2px 12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-1px}
    .htab em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-3);background:rgba(44,49,43,.07);
      border-radius:99px;padding:3px 8px;font-variant-numeric:tabular-nums}
    .htab.on{color:var(--npds-blue-700);border-bottom-color:var(--npds-blue-600)}
    .htab.on em{color:var(--npds-blue-700);background:var(--npds-blue-100)}
    /* a row's item cell: icon, title, sentence */
    .it{display:flex;align-items:center;gap:13px;min-width:0}
    .it-i{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
      background:rgba(44,49,43,.055);color:var(--ink-2)}
    .it-i.neg{color:var(--neg);background:rgba(155,74,62,.12)}
    .it-i.warn{color:var(--warn);background:rgba(176,138,86,.18)}
    .it-t{min-width:0}
    .it-t b{display:block;font-size:var(--d-name);font-weight:550;color:var(--ink)}
    .it-t small{display:block;font-size:var(--d-sub);color:var(--ink-3);margin-top:3px}
    .rowacts{display:inline-flex;gap:9px;justify-content:flex-end}
    .primary.xs,.second.xs{min-height:34px;padding:0 15px;font-size:13px;width:auto;margin:0}
    /* the four numbers, each its own card and its own destination */
    .body.wide .sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--d-stack);flex:none}
    .sumtile{display:flex;align-items:center;gap:17px;padding:26px 24px;text-align:left;
      font-family:inherit;color:inherit}
    .sumtile:hover{background:rgba(255,255,255,.92)}
    .sumi{width:50px;height:50px;border-radius:15px;background:var(--npds-blue-100);
      display:grid;place-items:center;flex:none}
    .sumi .ic{width:24px;height:24px}
    .sumt{min-width:0}
    .sumt b{display:block;font-size:34px;font-weight:450;letter-spacing:-.028em;line-height:1;
      font-variant-numeric:tabular-nums}
    .sumt b em{font-style:normal;font-size:17px;color:var(--ink-3)}
    .sumt small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:10px}
    /* what needs you and the rooms are two narrower tables, side by side */
    .body.wide .homepair{display:grid;grid-template-columns:1fr 1fr;gap:var(--d-stack);align-items:start;min-height:0}
    .body.wide .paircol{display:flex;flex-direction:column;min-width:0}
    .body.wide .paircol .act-t small{white-space:normal}
    .body.wide .paircol .act-go{font-size:11.5px}
    .body.wide .paircol .dtable th{padding:11px 12px}
    .body.wide .paircol .dtable td{padding:10px 12px}
    .body.wide .paircol .dtable td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}
    /* the section label sits clear of its card, and aligns with the card's text */
    .body.wide .flabel{margin:4px 4px 10px;padding:0 12px}
    /* on a wide screen what needs you ends in a button, not a link */
    .body.wide .act-go{min-height:34px;padding:0 15px;border-radius:999px;
      border:1px solid var(--npds-blue-500);background:rgba(255,255,255,.94);
      color:var(--npds-blue-700);font-weight:550;display:inline-flex;align-items:center}
    .body.wide .act{align-items:center}
    .body.wide .act-t small{white-space:normal}
    .table-card{overflow:hidden;padding:4px 6px}
    .dtable{border-collapse:collapse;width:100%;font-size:12.5px}
    .dtable th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
      font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
    .dtable td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
    .dtable tbody tr:last-child td{border-bottom:0}
    .dtable tbody tr{cursor:pointer}
    .dtable tbody tr:hover td{background:rgba(255,255,255,.34)}
    .dtable td b{color:var(--ink);font-weight:550;font-size:13px}
    .dtable td.num{font-variant-numeric:tabular-nums;font-weight:550;color:var(--ink)}
    .dtable td.mute{color:var(--ink-3)}
    .dtable td.rt,.dtable th.rt{text-align:right}
    .topbar,.head{max-width:760px;width:100%;margin-left:auto;margin-right:auto}
    /* a sheet comes up from the bottom of a phone because that is where the
       thumb is. On a desktop it comes in from the right, beside the work,
       and the work stays where it was. */
    .sheet{left:auto;right:0;top:0;bottom:0;width:min(440px,42vw);max-height:none;
      border-radius:22px 0 0 22px;padding:22px 26px 26px;overflow-y:auto;
      transform:translateX(100%);box-shadow:-24px 0 56px -28px rgba(38,52,36,.42);
      transition:transform .26s cubic-bezier(.32,.72,0,1)}
    .sheet.on{transform:none}
    .sheet .grab{display:none}
    .sheet.full,.sheet.tall{top:0;bottom:0;max-height:none;border-radius:22px 0 0 22px;
      padding:22px 26px 26px}
    .sheet.formsheet{width:min(520px,48vw)}
    /* a question is a question, not a banner across the screen */
    .cf-card{max-width:420px}
    /* round chips are spaced apart, not stretched apart — space-between across
       844px put 56px circles a hand's width from each other */
    .qrrow{max-width:560px;margin-left:auto;margin-right:auto}
    .greet-acts .qrrow{margin-left:0}
    .fabdock,.searchdock{max-width:760px;left:50%;transform:translateX(-50%)}
    .selbar{max-width:760px;left:50%;transform:translateX(-50%)}
    .toast{max-width:420px;left:50%;transform:translateX(-50%)}

  }

  @media (min-width:1100px){
    .body{max-width:880px}
    .topbar,.head{max-width:880px}
    /* a list and what you opened from it, together */
    #app.split{flex-direction:row;gap:0;max-width:none}
    #app.split>.col-list{width:420px;flex:none;border-right:1px solid rgba(255,255,255,.55);
      display:flex;flex-direction:column;min-height:0;overflow:hidden}
    #app.split>.col-detail{flex:1;min-width:0;display:flex;flex-direction:column;
      min-height:0;overflow:hidden}
    #app.split .body{max-width:none;padding-left:20px;padding-right:20px}
    #app.split>.col-list .body{padding-left:16px;padding-right:16px}
    #app.split .topbar,#app.split .head{max-width:none}
    #app.split .row.picked2{background:var(--npds-blue-100)}
    .fabdock,.searchdock,.selbar{max-width:880px}
  }

  /* ===== the log-in gate, ported from the feature set =====
     Every user type meets the same screen: a username or email, a password,
     and a button. No district code, no tenant ID, no centre picker, because
     tenant resolution happens behind the request. The thing the spec is
     proudest of is the thing you cannot see, so what is visible is how
     little there is. Daybreak's semantic tokens are declared on the gate
     itself, the way the feature set declares them on .phone.auth. */
  .gate{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden;
    background:none;
    --text-default:#3B423A; --text-muted:#5D6655; --text-subtle:#646B5C;
    --text-field:#6E7568;
    --surface-field:#fff; --surface-raised:rgba(255,255,255,.92);
    --surface-sunken:rgba(44,49,43,.055); --surface-card:rgba(255,255,255,.74);
    --action-fill:#037aa7; --action-text:#056488;
    --control-text:#5a5f68;
    --status-critical:#9B4A3E;
    --border-hairline:rgba(44,49,43,.09); --border-check:rgba(44,49,43,.54);
    --touch-primary:48px}
  .gate[hidden]{display:none}
  .authwrap{position:relative;z-index:3;flex:1;min-height:0;display:flex;flex-direction:column;
    padding:0 16px;overflow:hidden}
  .authwrap.mid{justify-content:center;padding-bottom:34px}
  .gate .brand{display:flex;flex-direction:column;align-items:center;gap:11px;padding:24px 0 16px}
  .gate .brand .glyph{width:52px;height:52px;border-radius:20px;font-size:25px;
    background:var(--surface-raised)}
  .gate .brand b{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:21px;
    letter-spacing:-.012em;color:var(--text-default)}
  .gate h1.auth-h{font-family:Newsreader,Georgia,serif;font-weight:400;line-height:1.24;
    letter-spacing:-.015em;color:var(--text-default);margin:0 0 12px;font-size:21px;text-align:center}
  .card.loginc{background:var(--surface-card);backdrop-filter:blur(16px) saturate(1.05);
    -webkit-backdrop-filter:blur(16px) saturate(1.05);border-radius:24px;
    border:1px solid rgba(255,255,255,.5);box-shadow:0 14px 30px -20px rgba(40,55,38,.42);
    padding:24px 16px 16px;margin:0 0 4px}
  /* Daybreak's field: the label above, a real input in an opaque box, and the
     error as a sibling inside the same group. */
  .stackgrp{display:grid;gap:12px;margin-bottom:0}
  .ofield{display:block;min-width:0}
  .of-l{display:block;font-size:12.5px;line-height:1.5;color:var(--text-muted);
    font-weight:500;margin:0 2px 6px}
  .of-box{position:relative;display:flex;align-items:center;gap:8px;min-width:0;min-height:54px;
    background:var(--surface-field);border:1px solid var(--border-check);border-radius:12px;
    padding:0 6px 0 13px}
  .of-box.is-error{border-color:var(--status-critical);border-width:1.5px;
    background:rgba(155,74,62,.05)}
  .of-v{flex:1;min-width:0;font-size:17px;font-weight:450;line-height:1.4;color:var(--text-default);
    border:0;background:none;outline:none;font-family:inherit;padding:0;text-overflow:clip}
  .of-v::placeholder{color:var(--text-field)}
  .gate .mini.lg{width:44px;height:44px;min-height:44px;flex:none;border-radius:999px;border:0;
    background:none;display:grid;place-items:center;color:var(--control-text);padding:0;
    margin-right:-8px;cursor:pointer}
  .fcm-fielderr{display:flex;align-items:flex-start;gap:7px;margin:7px 0 0;padding:0 2px;
    font-size:13px;line-height:1.45;color:var(--status-critical)}
  .fcm-fielderr svg{width:15px;height:15px;flex:none;margin-top:1px}
  /* Daybreak's banner. Text always at --text-default, and no spine. */
  .gate .fcm-banner{display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;
    margin-bottom:16px;background:rgba(155,74,62,.1)}
  .gate .fcm-banner .bn-i{flex:none;color:var(--status-critical);margin-top:2px}
  .gate .fcm-banner .bn-t{flex:1;min-width:0;margin:0;font-size:15px;line-height:1.5;
    color:var(--text-default)}
  /* Daybreak's .cb checkbox, in a 44px row so the whole line is the target */
  .stayband{margin:16px 0}
  .stay{display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.5;
    color:var(--text-muted);background:none;border:0;font-family:inherit;text-align:left;
    padding:0;cursor:pointer;width:100%;min-height:44px;margin-top:-11px;margin-bottom:-11px}
  .cb{width:21px;height:21px;border-radius:6px;flex:none;display:grid;place-items:center;
    box-shadow:inset 0 0 0 1.5px var(--border-check);background:#fff}
  .cb.on{background:var(--action-fill);box-shadow:none}
  .cb svg{width:13px;height:13px}
  .card.loginc .stackgrp + *:not(.stayband){margin-top:16px}
  .recover{display:flex;margin:16px -16px -16px;padding:0 16px;
    border-top:1px solid var(--border-hairline)}
  .recover button{flex:1;display:flex;align-items:center;justify-content:center;min-height:46px;
    font-size:13.5px;font-weight:550;color:var(--action-text);text-decoration:none;
    text-align:center;padding:0 4px;border:0;background:none;font-family:inherit;cursor:pointer}
  .recover button + button{border-left:1px solid var(--border-hairline)}
  .authfoot{position:relative;z-index:3;flex:none;padding:0 16px 24px;text-align:center;
    font-size:12.5px;line-height:1.5;color:var(--text-muted)}
  .authfoot a{color:var(--action-text);text-decoration:none;font-weight:550}
  .gbusy{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;
    text-align:center;padding-bottom:60px;position:relative;z-index:3}
  .gspin{width:34px;height:34px;border-radius:999px;border:3px solid var(--npds-blue-100);
    border-top-color:var(--npds-blue-600);animation:gspin 1s linear infinite}
  @keyframes gspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.gspin{animation-duration:3s}}
  /* the clock sits above the gate wherever the simulated status bar is drawn */
  .status{z-index:70}
  /* #app and the tab bar set their own display, so the hidden attribute alone
     does not move them. While the gate is up they are gone, which leaves the
     screen's own sky, hills and haze as the background the login sits on. */
  .behind-gate{display:none!important}

  /* ===== check-in and check-out settings, ported from the feature set ===== */
  .fcm-switch{width:50px;height:30px;flex:none;border-radius:999px;border:0;padding:0;
    background:rgba(44,49,43,.54);position:relative;cursor:pointer}
  .fcm-switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(44,49,43,.28);
    transition:transform .16s ease}
  .fcm-switch[aria-checked="true"]{background:var(--npds-blue-600)}
  .fcm-switch[aria-checked="true"]::after{transform:translateX(20px)}
  @media (prefers-reduced-motion:reduce){.fcm-switch::after{transition:none}}
  .srow{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;width:100%;
    background:none;border:0;font-family:inherit;text-align:left}
  .srow + .srow{border-top:1px solid var(--line)}
  .srow > b{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink)}
  .srow.two{align-items:flex-start;padding-top:11px;padding-bottom:12px;min-height:0}
  .srow.two .st{flex:1;min-width:0}
  .srow.two .st b{display:block;font-size:14.5px;font-weight:500;color:var(--ink)}
  .srow.two .st small{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:3px}
  .srow.two .fcm-switch{margin-top:1px}

function certState(d){
  if(!d) return 'exp';
  const days=(new Date(d)-new Date('2026-06-22'))/864e5;
  return days<0?'exp':days<45?'warn':'ok';
}
/* the base app's review clock: overdue, due inside 60 days, or fine */
function reviewStatus(d){
  if(!d) return 'none';
  const days=(new Date(d)-new Date('2026-06-22'))/864e5;
  return days<0?'overdue':days<60?'due':'ok';
}
function staffAlerts(s){
  const a=[];
  [['State cert',s.cert],['First aid / CPR',s.firstAid],['CDA credential',s.cda]].forEach(([n,d])=>{
    const st=certState(d);
    if(st!=='ok') a.push({kind:st==='exp'?'Expired':'Expiring',name:n,date:d});
  });
  return a;
}
const alertTotal=()=>STAFF.reduce((n,s)=>n+staffAlerts(s).length,0);
const dateLabel=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Not on file';

/* ---------------------------------------------------------------------------
   CONFIRM — ported from the teacher app.
   For the handful of acts that reach a family before anyone can take them back:
   marking a child absent, and marking several at once.
   --------------------------------------------------------------------------- */
let pending=null;
function confirmAsk(o){
  pending=o.act;
  let el=$('#confirmwrap');
  if(!el){el=document.createElement('div');el.id='confirmwrap';el.className='confirmwrap';
    document.querySelector('.screen').appendChild(el);}
  el.innerHTML=`<div class="cf-scrim" data-act="cfno"></div>
   <div class="cf-card" role="alertdialog" aria-modal="true" aria-label="${o.title}">
    <h4>${o.title}</h4><p>${o.body}</p>
    <button class="primary" data-act="cfyes">${o.label}</button>
    <button class="second" data-act="cfno">Cancel</button>
   </div>`;
  requestAnimationFrame(()=>el.classList.add('on'));
}
function confirmClose(){const el=$('#confirmwrap');
  if(el){el.classList.remove('on');setTimeout(()=>el.remove(),200);} pending=null;}

let tt;
function toast(txt){
  const t=$('#toast');
  t.innerHTML=ic('check','ic sm','#A8D8B4','2.4')+`<span>${txt}</span>`;
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);
}

/* What needs you depends on what you are responsible for. A teacher is never
   shown an overdue invoice, and a director is not asked to post the day's nap
   note. Same component, different list. */
function actionItems(){
  const items=[];
  if(CAN.money==='all'){
    INVOICES.filter(i=>invStatus(i)==='overdue').forEach(i=>items.push({icon:'alert',tone:'neg',
      pri:'Overdue',priTone:'neg',area:'Billing',
      t:`${i.family} invoice 7 days overdue`,s:`${m(money(invTotal(i)))} due · card declined`,go:'Collect',act:`inv:${i.id}`}));
  }
  if(CAN.staff){
    const certs=alertTotal();
    if(certs) items.push({icon:'clock',tone:'warn',
      pri:'Due soon',priTone:'warn',area:'Compliance',
      t:`${certs} staff credential ${certs===1?'alert':'alerts'}`,s:'Expiring certifications and reviews due',go:'Remind',act:'go:staff'});
  }
  if(CAN.money==='all'){
    const mism=CLAIMS.reduce((a,c)=>a+c.mismatches.filter(x=>!S.resolved[x.id]).length,0);
    if(mism) items.push({icon:'bills',tone:'',
      pri:'Due soon',priTone:'warn',area:'Subsidy',
      t:`May subsidy · ${mism} ${mism===1?'mismatch':'mismatches'} (${m('$384')})`,s:'Review required before Jun 15',go:'Reconcile',act:'claim:sc-may2026'});
  }
  if(CAN.signoff){
    const rev=ACTIVITIES.filter(a=>a.review).length;
    if(rev) items.push({icon:'clipboard',tone:'warn',
      pri:'Urgent',priTone:'neg',area:'Incident',
      t:`${rev} incident ${rev===1?'report':'reports'} awaiting sign-off`,s:'Ella Park · logged 10:42 AM by Sarah Kim',go:'Review',act:'go:activities'});
  }
  if(ROLE.scope==='family'){
    const kids=myKids();
    if(/owe|bill|invoice|pay|balance/.test(s)){
      const f=F(ROLE.fam);
      return f&&f.balance>0?`${money(f.balance)} is outstanding on your account.`
        :`Your account is paid up${f&&f.autopay?', and autopay is on':''}.`;
    }
    if(/checked in|drop|arrive|what time/.test(s))
      return kids.map(k=>k.status==='here'?`${k.name.split(' ')[0]} was checked in at ${k.tin}${k.who?' by '+k.who:''}`
        :`${k.name.split(' ')[0]} is ${k.status==='absent'?'marked absent':'not checked in yet'}`).join('. ')+'.';
    const feed=visibleActivities();
    return feed.length?`Today so far: ${feed.map(a=>a.title.toLowerCase()).join('; ')}.`
      :'Nothing has been posted yet today.';
  }
  if(CAN.rooms==='one'){
    const mine=myKids();
    const notin=mine.filter(k=>k.status!=='here'&&k.status!=='absent');
    if(notin.length) items.push({icon:'in',tone:'warn',
      t:`${notin.length} not checked in yet`,s:notin.map(k=>k.name.split(' ')[0]).join(', '),go:'Register',act:'go:attendance'});
    const notes=mine.filter(k=>k.note);
    notes.forEach(k=>items.push({icon:'pen',tone:'',
      t:`Note for ${k.name}`,s:k.note,go:'Open',act:`child:${k.id}`}));
    const alg=mine.filter(k=>k.allergy);
    if(alg.length) items.push({icon:'shield',tone:'',
      t:`${alg.length} ${alg.length===1?'child has an allergy':'children have allergies'}`,
      s:alg.map(k=>`${k.name.split(' ')[0]} · ${k.allergy}`).join(' · '),go:'Register',act:'go:attendance'});
  }
  return items;
}

function fopts(list,isOn,act,searchable,allAct){

function wireDial(){
  const dl=$('#dial'); if(!dl||dl.dataset.on)return; dl.dataset.on='1';
  const set=e=>{const r=dl.getBoundingClientRect();
   const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
   let a=Math.atan2(y,x)*180/Math.PI+90; if(a<0)a+=360;
   const T=clkT();
   if(clkMode()==='h'){const h=Math.round(a/30)%12;T.h=h===0?12:h;}
   else T.m=Math.round(a/6)%60;
   repaintClock();};
  let down=false;
  dl.addEventListener('pointerdown',e=>{down=true;dl.setPointerCapture(e.pointerId);set(e)});
  dl.addEventListener('pointermove',e=>{if(down)set(e)});
  /* let go on the hour and the dial moves on to the minutes by itself */
  dl.addEventListener('pointerup',()=>{down=false;
   if(clkMode()==='h'){setClkMode('m');repaintClock();}});
}

const attAll=()=>!S.attSel.size||S.attSel.size>=ATT_OPTS.length;
const attLabel=()=>attAll()?'Everyone'
  :S.attSel.size===1?(ATT_OPTS.find(o=>o[0]===[...S.attSel][0])||['','?'])[1]
  :`${S.attSel.size} selected`;
const msgAll=()=>!S.msgSel.size||S.msgSel.size>=MSG_OPTS.length;
const msgLabel=()=>msgAll()?'Everyone'
  :S.msgSel.size===1?(MSG_OPTS.find(o=>o[0]===[...S.msgSel][0])||['','?'])[1]
  :`${S.msgSel.size} selected`;
/* a child matches the status filter on their state, or on having an allergy */
const attMatch=k=>attAll()||S.attSel.has(k.status)||(S.attSel.has('allergy')&&!!k.allergy);
const inRoom=x=>{
  if(ROLE.scope==='family') return myRooms().includes(x);
  if(ROLE.scope==='room')   return x===ROLE.room;
  return roomAll()||S.roomSel.has(x);
};
const mineKid=k=>!!k&&myKids().some(x=>x.id===k.id);

/* An activity reaches a parent only if it is about their child or the room
   they are in — and never while an incident is still waiting on the director's
   sign-off, because until it is signed it is not yet the centre's word. */
function visibleActivities(){
  let list=ACTIVITIES.filter(a=>inRoom(a.rid));
  if(ROLE.scope==='family'){
    const names=myKids().map(k=>k.name);
    list=list.filter(a=>(a.kid==='Room'||names.includes(a.kid)) && !a.review);
  }
  return list;
}
/* A parent sees the threads they are part of; staff threads are not theirs. */
function visibleThreads(){
  if(ROLE.scope==='family'){
    const f=F(ROLE.fam);
    return THREADS.filter(t=>t.scope==='family'&&f&&t.who===f.contact);
  }
  if(ROLE.scope==='room') return THREADS.filter(t=>!t.rid||inRoom(t.rid));
  return THREADS;
}
/* Money: a director sees the centre's, a parent sees their own, a teacher none. */
function visibleInvoices(){
  if(CAN.money==='own') return INVOICES.filter(i=>i.fam===ROLE.fam);
  return CAN.money?INVOICES:[];
}

/* The base parent app groups the day under plain-language headings a parent
   recognises, not the staff-facing type names. */
const PARENT_CAT={
  mood:'Mood & behavior', behavior:'Mood & behavior', kudos:'Learning',
  note:'Learning', observation:'Learning',
  incident:'Incidents', accident:'Incidents',
  nap:'Sleep & naps', meal:'Meals & snacks', toilet:'Diapering & potty',
  photo:'Photos & video', medication:'Medication',
};
/* Two kinds of entry a parent is asked to acknowledge, because the centre needs
   to know they were seen: something that hurt, and something administered. */
const mins=t=>{const x=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((t||'').trim());
  if(!x)return 0; let h=+x[1]%12; if(/pm/i.test(x[3]))h+=12; return h*60+ +x[2];};
const NEEDS_ACK=a=>['incident','accident','medication'].includes(a.type);

function vParentDay(){
  const kids=myKids();
  if(!kids.length) return `${topbar('Activities','')}<div class="body"><div class="empty">No children on your account.</div></div>`;

     not one child's half of it */
  const everyone=kids.length>1&&(S.kid==='all'||S.kid==null);
  const kid=everyone?null:(kids.find(k=>k.id===S.kid)||kids[0]);
  const shown=everyone?kids:[kid];
  const names=shown.map(k=>k.name);
  const all=visibleActivities().filter(a=>names.includes(a.kid)
    ||(a.kid==='Room'&&shown.some(k=>k.rid===a.rid||k.room===a.rid)));
  const f=S.pfilter||'all';
  const inCat=(a,c)=>c==='all'?true
    :c==='photos'?a.type==='photo'
    :c==='meals'?a.type==='meal'
    :c==='sleep'?a.type==='nap':true;
  const list=all.filter(a=>inCat(a,f)).slice().sort((x,y)=>mins(y.at)-mins(x.at));
  const naps=all.filter(a=>a.type==='nap'), meals=all.filter(a=>a.type==='meal');

    :k.out?`out ${k.tout||''}`.trim():'not in yet';

     <span class="rch${open?' up':''}">${ic('chev','ic sm','var(--npds-blue-700)','2.4')}</span>
    </button>
    ${open?`<div class="kidrows">
     ${kids.length>1?(()=>{
       /* the All row does what the child rows do, for everyone at once */
       const anyIn=kids.some(k=>k.status==='here');
       const n2=kids.filter(k=>anyIn?k.status==='here':k.status!=='here').length;
       return `<div class="kidrow${everyone?' sel':''}">
       <span class="krtick" data-act="pkid:all" role="button" tabindex="0"
         aria-label="Show both children" aria-pressed="${everyone}">${everyone?ic('check','','#fff','3.2'):''}</span>
       <span class="kr-t" data-act="pkid:all"><b>All</b><small>Both, in time order</small></span>
       <button class="mini lbl ${anyIn?'sec':'pri'}" data-act="pall:${anyIn?'out':'in'}"
         aria-label="Check ${anyIn?'out':'in'} both children">${ic(anyIn?'out':'in','ic sm','currentColor','1.9')}Check ${anyIn?'out':'in'}</button>
      </div>`;})():''}
     ${kids.map(k=>{const sel=!everyone&&kid&&k.id===kid.id;
      return `<div class="kidrow${sel?' sel':''}">
      ${kids.length>1?`<span class="krtick" data-act="pkid:${k.id}" role="button" tabindex="0"

      <span class="kr-t"${kids.length>1?` data-act="pkid:${k.id}"`:''}><b>${first(k)}</b><small>${roomName(k.room)} · ${st(k)}</small></span>
      ${k.status==='here'

     </div>`;}).join('')}
    </div>`:''}
   </div>`;})()}

   <div class="qrrow pqr">
    ${chip('all','listCheck','All')}
    ${chip('photos','camera','Photos')}
    ${chip('meals','meal','Meals')}
    ${chip('sleep','zzz','Sleep')}

   <div class="feedhd"><b>${everyone?'The day so far':who+"'s day so far"}</b>

   <div class="pfeed">${list.length?list.map(pcard).join(''):'<div class="empty">Nothing posted in this view yet.</div>'}</div>
  </div>`;
}
/* the parent's card: the staff card plus the category a parent recognises, and
   an acknowledgement where the centre needs to know it was seen */
